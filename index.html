<title>F1 Companion</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Saira:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">

<style>
/* ------------------------------------------------------------------
   F1 Companion — page unique, autonome, sans dépendance réseau.
   Thème sombre unique et assumé : c'est le monde visuel de la F1.
   Toutes les couleurs sont peintes en dur pour que la page tienne
   quel que soit le fond de l'hôte.
   ------------------------------------------------------------------ */
:root {
  --ink:        #0A0A0E;
  --surface:    #14141C;
  --surface-2:  #1D1D28;
  --line:       #2B2B3A;
  --red:        #E10600;
  --red-dim:    #8E0400;
  --text:       #F2F2F5;
  --muted:      #9494A6;   /* remonté depuis #8B8B9C : contraste des micro-labels */
  --live:       #00D26A;
  --warn:       #FFB020;

  --display: "Saira Condensed", "Arial Narrow", system-ui, sans-serif;
  --body:    "Saira", system-ui, -apple-system, sans-serif;
  --mono:    "JetBrains Mono", ui-monospace, "SF Mono", monospace;

  --tabbar: 62px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ink);
  color: var(--text);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; border-radius: 4px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ---------- Ossature ---------- */

.app {
  max-width: 540px; margin: 0 auto;
  padding: 0 16px calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 78px);
  min-height: 100vh;
}

.topbar {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 12px; padding: 18px 0 14px;
}
.wordmark { font-family: var(--display); font-weight: 800; font-size: 25px; letter-spacing: -.02em; line-height: 1; }
.wordmark span { color: var(--red); }
.zone { font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--muted); }

.screen { display: none; }
.screen.on { display: block; }

/* ---------- Barre d'onglets ---------- */

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: flex;
  background: rgba(10,10,14,.94); backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabbar button {
  flex: 1; height: var(--tabbar);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--muted); font-size: 10px; font-weight: 600;
  letter-spacing: .03em; text-transform: uppercase; transition: color .15s;
}
.tabbar button[aria-selected="true"] { color: var(--text); }
.tabbar button[aria-selected="true"] .glyph { color: var(--red); }
.glyph { font-size: 17px; line-height: 1; }

/* ---------- Barre d'action « Regarder » ----------
   Persistante dès qu'une séance est en cours ou imminente : c'est le
   raccourci qui évite les trois taps pour lancer un diffuseur. */
.watchbar {
  position: fixed; left: 0; right: 0;
  bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px));
  z-index: 41;
  max-width: 540px; margin: 0 auto; padding: 8px 16px;
  display: none;
}
.watchbar.on { display: block; }
.watchbar button {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  width: 100%; padding: 12px 15px; border-radius: 11px;
  background: var(--red); color: #fff;
  font-family: var(--display); font-weight: 700; font-size: 15.5px;
  letter-spacing: .04em; text-transform: uppercase;
  box-shadow: 0 6px 20px rgba(0,0,0,.45);
}
.watchbar .sub {
  font-family: var(--mono); font-size: 11px; font-weight: 500;
  letter-spacing: 0; text-transform: none; opacity: .85;
}

/* ---------- Blocs ---------- */

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }

.eyebrow {
  font-family: var(--display); font-weight: 700; font-size: 11.5px;
  letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
}

.hero {
  position: relative; overflow: hidden;
  background: radial-gradient(120% 100% at 100% 0%, rgba(225,6,0,.20), transparent 62%), var(--surface-2);
  border: 1px solid var(--line); border-radius: 16px; padding: 18px;
  display: flex; flex-direction: column; gap: 14px;
}
.hero::before { content:""; position:absolute; inset:0 auto 0 0; width:3px; background:var(--red); }
.hero-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.hero-flag { font-size: 30px; line-height: 1; }

.session-name {
  font-family: var(--display); font-weight: 800; font-size: 38px;
  line-height: .96; letter-spacing: -.01em; text-wrap: balance; margin: 0;
}
.gp-name { font-size: 14px; font-weight: 600; color: var(--muted); margin-top: 5px; }

.countdown { display: flex; gap: 8px; }
.unit {
  flex: 1; background: rgba(0,0,0,.34); border: 1px solid var(--line);
  border-radius: 9px; padding: 8px 4px 6px; text-align: center;
}
.unit b {
  display: block; font-family: var(--mono); font-weight: 700; font-size: 25px;
  font-variant-numeric: tabular-nums; line-height: 1.05;
}
.unit i { font-style: normal; font-size: 9.5px; font-weight: 600; letter-spacing: .1em; color: var(--muted); }

.times { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.times div { display: flex; justify-content: space-between; gap: 12px; }
.times span:first-child { color: var(--muted); }
.times b { font-family: var(--mono); font-weight: 500; font-variant-numeric: tabular-nums; }

.cta {
  display: flex; align-items: center; justify-content: space-between; width: 100%;
  background: var(--red); color: #fff;
  font-family: var(--display); font-weight: 700; font-size: 16px;
  letter-spacing: .04em; text-transform: uppercase;
  padding: 12px 15px; border-radius: 10px; transition: background .15s;
}
.cta:hover { background: #c60500; }

/* ---------- Pastilles ---------- */

.pill {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 5px; white-space: nowrap;
}
.pill.live  { color: var(--live); background: rgba(0,210,106,.13); }
.pill.free  { color: var(--live); background: rgba(0,210,106,.13); }
.pill.warn  { color: var(--warn); background: rgba(255,176,32,.13); }
.pill.lang  { color: #fff;        background: var(--red); }
.pill.quiet { color: var(--muted); background: rgba(148,148,166,.15); }
.pill.owned { color: var(--live); background: rgba(0,210,106,.13); }

.dot { width:6px; height:6px; border-radius:50%; background:currentColor; animation: blink 1.7s ease-in-out infinite; }
@keyframes blink { 0%,100% { opacity:1 } 50% { opacity:.3 } }

/* ---------- Indicateur de qualité ---------- */

.qual { display: inline-flex; align-items: center; gap: 6px; }
.bars { display: inline-flex; gap: 2px; align-items: flex-end; }
.bars i { display: block; width: 4px; border-radius: 1px; background: var(--line); }
.bars i:nth-child(1) { height: 6px; }
.bars i:nth-child(2) { height: 9px; }
.bars i:nth-child(3) { height: 12px; }
.bars i.fill { background: var(--text); }
.bars.est i.fill { background: var(--muted); }
.qual-label { font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--muted); }

/* ---------- Segmenté ---------- */

.seg {
  display: flex; gap: 3px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; padding: 3px;
}
.seg button {
  flex: 1; padding: 7px 4px; border-radius: 7px;
  font-size: 12.5px; font-weight: 600; color: var(--muted);
  transition: background .15s, color .15s;
}
.seg button[aria-pressed="true"] { background: var(--red); color: #fff; }

/* ---------- Manches ---------- */

.round { background: var(--surface); border: 1px solid var(--line); border-radius: 13px; overflow: hidden; }
.round.next { border-color: var(--red-dim); background: var(--surface-2); }
.round.done .round-head { opacity: .52; }

.round-head { display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 14px; text-align: left; }
.round-flag { font-size: 26px; line-height: 1; }
.round-id { font-family: var(--mono); font-size: 10.5px; font-weight: 700; color: var(--muted); letter-spacing: .06em; }
.round-title { font-family: var(--display); font-weight: 700; font-size: 18px; line-height: 1.1; }
.round-sub { font-size: 11.5px; color: var(--muted); }
.round-when {
  margin-left: auto; text-align: right; font-family: var(--mono);
  font-size: 11.5px; font-weight: 500; color: var(--muted); white-space: nowrap;
}
.chev { color: var(--muted); font-size: 12px; transition: transform .2s; }
.round[open-state="1"] .chev { transform: rotate(90deg); }

.sessions { border-top: 1px solid var(--line); padding: 4px 6px 6px; }

.srow {
  display: flex; align-items: center; gap: 11px; width: 100%;
  padding: 10px 8px; text-align: left; border-radius: 9px; transition: background .13s;
}
.srow:hover { background: rgba(255,255,255,.035); }
.srow + .srow { border-top: 1px solid rgba(43,43,58,.6); }
.srow-tag {
  font-family: var(--display); font-weight: 700; font-size: 12px;
  letter-spacing: .05em; width: 62px; flex: none; color: var(--muted);
}
.srow.key .srow-tag { color: var(--text); }
.srow-day { font-size: 12px; color: var(--muted); }
.srow-time { margin-left: auto; font-family: var(--mono); font-size: 13.5px; font-weight: 500; font-variant-numeric: tabular-nums; }
.srow.past { opacity: .45; }

/* ---------- Feuille de séance ---------- */

.sheet-bg { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.62); backdrop-filter: blur(3px); display: none; }
.sheet-bg.on { display: block; }

.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 51;
  max-height: 92vh; max-width: 540px; margin: 0 auto;
  background: var(--ink); border: 1px solid var(--line); border-bottom: 0;
  border-radius: 18px 18px 0 0;
  overflow-y: auto; overscroll-behavior: contain;
  transform: translateY(100%);
  transition: transform .26s cubic-bezier(.32,.72,0,1);
  padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 24px);
}
.sheet.on { transform: translateY(0); }

.sheet-bar {
  position: sticky; top: 0; background: var(--ink); padding: 12px 0 10px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  border-bottom: 1px solid var(--line); margin-bottom: 14px;
}
.close {
  width: 30px; height: 30px; flex: none; border-radius: 50%;
  background: var(--surface-2); color: var(--muted); font-size: 15px; line-height: 1;
}

/* ---------- Diffuseurs ----------
   Carte compacte : le détail (note, géo) est replié derrière un tap.
   Avec le filtre « tous pays », une course peut lister 20 sources —
   la version dépliée en permanence était un mur de texte. */

.src { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.src.owned { border-color: rgba(0,210,106,.35); }
.src.pref  { border-color: rgba(225,6,0,.4); }
.src.pinned { border-color: var(--red); background: var(--surface-2); }

.src-main { display: flex; align-items: center; gap: 11px; width: 100%; padding: 12px 14px; text-align: left; }
.src-id { min-width: 0; }
.src-name { font-family: var(--display); font-weight: 700; font-size: 17px; line-height: 1.15; }
.src-where { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
.src-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 7px; }
.src-more { margin-left: auto; flex: none; color: var(--muted); font-size: 12px; transition: transform .2s; }
.src[data-open="1"] .src-more { transform: rotate(90deg); }

.src-detail { padding: 0 14px 12px; border-top: 1px solid var(--line); margin-top: -1px; padding-top: 12px; }
.src-scope { font-size: 12.5px; }
.src-geo { font-size: 11.5px; color: var(--warn); margin-top: 6px; }
.src-note { font-size: 11.5px; color: var(--muted); margin-top: 6px; line-height: 1.45; }

.src-actions { display: flex; gap: 8px; padding: 0 14px 12px; }
.src-actions > * {
  flex: 1; text-align: center; padding: 9px 10px; border-radius: 9px;
  font-size: 13px; font-weight: 600;
  border: 1px solid var(--line); background: var(--surface-2);
}
.src-actions .go { background: var(--red); border-color: var(--red); color: #fff; }
.src-actions .go:hover { background: #c60500; }

.urlbox {
  margin-top: 12px; padding: 11px 12px;
  background: rgba(0,0,0,.28); border: 1px solid var(--line); border-radius: 10px;
}
.urlbox-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.urledit { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; }
.urledit input {
  width: 100%; background: var(--surface-2); color: var(--text);
  border: 1px solid var(--line); border-radius: 9px;
  padding: 10px 11px; font-family: var(--mono); font-size: 12.5px;
}

/* ---------- Classements ----------
   Une seule mesure (les points), donc une seule teinte : l'identité de
   l'écurie est portée par le texte, pas par la couleur. Onze teintes
   catégorielles seraient indistinguables et invalidables. */

.rank { display: flex; flex-direction: column; }
.rank-row {
  display: grid;
  grid-template-columns: 26px 1fr auto;
  align-items: center; gap: 10px;
  padding: 9px 0;
}
.rank-row + .rank-row { border-top: 1px solid rgba(43,43,58,.7); }
.rank-pos {
  font-family: var(--mono); font-size: 13px; font-weight: 700;
  color: var(--muted); font-variant-numeric: tabular-nums; text-align: right;
}
.rank-row.lead .rank-pos { color: var(--red); }
.rank-who { min-width: 0; }
.rank-name { font-family: var(--display); font-weight: 700; font-size: 16px; line-height: 1.15; }
.rank-team { font-size: 11.5px; color: var(--muted); }
.rank-val {
  font-family: var(--mono); font-size: 15px; font-weight: 700;
  font-variant-numeric: tabular-nums; text-align: right;
}
.rank-sub { font-family: var(--mono); font-size: 10.5px; color: var(--muted); text-align: right; }

/* Barre de magnitude : extrémité arrondie, ancrée à la ligne de base,
   2px de fond entre la barre et la piste. */
.track { grid-column: 2 / 4; height: 4px; background: rgba(148,148,166,.16); border-radius: 2px; margin-top: 2px; }
.track > span { display: block; height: 100%; background: var(--red); border-radius: 2px; }
.rank-row:not(.lead) .track > span { background: #7A3B38; }

.podium { display: flex; align-items: center; gap: 10px; padding: 9px 0; }
.podium + .podium { border-top: 1px solid rgba(43,43,58,.7); }
.podium-rd { font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--muted); width: 26px; flex: none; }
.podium-gp { font-size: 13px; min-width: 0; }
.podium-win { margin-left: auto; text-align: right; }
.podium-drv { font-family: var(--display); font-weight: 700; font-size: 15px; }
.podium-meta { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }

/* ---------- Réglages ---------- */

.field { display: flex; flex-direction: column; gap: 7px; }
.field > label { font-size: 12px; font-weight: 600; color: var(--muted); }
select {
  width: 100%; background: var(--surface-2); color: var(--text);
  border: 1px solid var(--line); border-radius: 10px;
  padding: 11px 12px; font: inherit; font-size: 15px; appearance: none;
}
select.compact { padding: 8px 10px; font-size: 13px; }

.checks { display: flex; flex-direction: column; gap: 2px; }
.check { display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px 12px; border-radius: 10px; text-align: left; font-size: 14.5px; }
.check:hover { background: rgba(255,255,255,.035); }
.box {
  width: 19px; height: 19px; flex: none; border: 1.5px solid var(--line);
  border-radius: 5px; display: grid; place-items: center; font-size: 11px; color: transparent;
}
.check[aria-pressed="true"] .box { background: var(--red); border-color: var(--red); color: #fff; }

.btn {
  display: block; width: 100%; text-align: center;
  padding: 11px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface-2);
  font-size: 14px; font-weight: 600;
}
.btn:hover { background: #262634; }

.prose { font-size: 12.5px; color: var(--muted); line-height: 1.55; }
.prose strong { color: var(--text); font-weight: 600; }
.prose ol, .prose ul { margin: 8px 0 0; padding-left: 18px; }
.prose li { margin-bottom: 4px; }

.notice {
  display: flex; gap: 10px; border-radius: 11px; padding: 12px 13px;
  font-size: 12.5px; line-height: 1.45;
  background: rgba(255,176,32,.09); border: 1px solid rgba(255,176,32,.26); color: var(--warn);
}
.notice.ok { background: rgba(0,210,106,.08); border-color: rgba(0,210,106,.26); color: var(--live); }

.stack-s { display: flex; flex-direction: column; gap: 8px; }
.stack-l { display: flex; flex-direction: column; gap: 22px; }
.sec     { display: flex; flex-direction: column; gap: 10px; }
.empty   { text-align: center; padding: 46px 20px; color: var(--muted); font-size: 13.5px; }
.grouphead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.groupcount { font-family: var(--mono); font-size: 11px; color: var(--muted); }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%) translateY(20px);
  bottom: calc(var(--tabbar) + 90px); z-index: 60;
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 16px; font-size: 13px; font-weight: 600;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
}
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>

<div class="app">
  <header class="topbar">
    <div class="wordmark">F1&nbsp;<span>COMPANION</span></div>
    <div class="zone" id="zone"></div>
  </header>

  <section class="screen on" id="s-live"></section>
  <section class="screen" id="s-cal"></section>
  <section class="screen" id="s-stats"></section>
  <section class="screen" id="s-set"></section>
</div>

<div class="watchbar" id="watchbar"></div>

<nav class="tabbar" role="tablist" aria-label="Navigation principale">
  <button role="tab" aria-selected="true"  data-tab="live"><span class="glyph">◉</span>En direct</button>
  <button role="tab" aria-selected="false" data-tab="cal"><span class="glyph">▤</span>Calendrier</button>
  <button role="tab" aria-selected="false" data-tab="stats"><span class="glyph">▦</span>Classements</button>
  <button role="tab" aria-selected="false" data-tab="set"><span class="glyph">⚙</span>Réglages</button>
</nav>

<div class="sheet-bg" id="sheet-bg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Détail de la séance"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";

/* ==================================================================
   CALENDRIER 2026 — API Jolpica-F1, relevé le 02/09/2026, embarqué.
   Heures en UTC, converties à l'affichage.
   ================================================================== */

const SEASON = 2026;
const SNAPSHOT = "2026-09-02";
const STANDINGS_AFTER = 12;   // dernière manche prise en compte

const ROUNDS = [
  { r:1,  name:"Grand Prix d'Australie",     circuit:"Albert Park",             city:"Melbourne",    cc:"AU", tz:"Australia/Melbourne",
    s:{ fp1:"2026-03-06T01:30Z", fp2:"2026-03-06T05:00Z", fp3:"2026-03-07T01:30Z", q:"2026-03-07T05:00Z", race:"2026-03-08T04:00Z" } },
  { r:2,  name:"Grand Prix de Chine",        circuit:"Shanghai International",  city:"Shanghai",     cc:"CN", tz:"Asia/Shanghai",
    s:{ fp1:"2026-03-13T03:30Z", sq:"2026-03-13T07:30Z", sprint:"2026-03-14T03:00Z", q:"2026-03-14T07:00Z", race:"2026-03-15T07:00Z" } },
  { r:3,  name:"Grand Prix du Japon",        circuit:"Suzuka",                  city:"Suzuka",       cc:"JP", tz:"Asia/Tokyo",
    s:{ fp1:"2026-03-27T02:30Z", fp2:"2026-03-27T06:00Z", fp3:"2026-03-28T02:30Z", q:"2026-03-28T06:00Z", race:"2026-03-29T05:00Z" } },
  { r:4,  name:"Grand Prix de Miami",        circuit:"Miami International",     city:"Miami",        cc:"US", tz:"America/New_York",
    s:{ fp1:"2026-05-01T16:00Z", sq:"2026-05-01T20:30Z", sprint:"2026-05-02T16:00Z", q:"2026-05-02T20:00Z", race:"2026-05-03T20:00Z" } },
  { r:5,  name:"Grand Prix du Canada",       circuit:"Gilles-Villeneuve",       city:"Montréal",     cc:"CA", tz:"America/Toronto",
    s:{ fp1:"2026-05-22T16:30Z", sq:"2026-05-22T20:30Z", sprint:"2026-05-23T16:00Z", q:"2026-05-23T20:00Z", race:"2026-05-24T20:00Z" } },

/** Constructeurs recalculés à partir des points pilotes. */
function constructorTable() {
  const map = new Map();
  for (const d of DRIVERS) {
    const t = map.get(d.team) || { team: d.team, pts: 0, w: 0, drivers: [] };
    t.pts += d.pts; t.w += d.w; t.drivers.push(d.code);
    map.set(d.team, t);
  }
  return [...map.values()].sort((a, b) => b.pts - a.pts).map((t, i) => Object.assign(t, { p: i + 1 }));
}

/* ==================================================================
   STOCKAGE
   localStorage peut être indisponible (navigation privée stricte) ou
   éphémère (Safari privé : il accepte l'écriture mais vide à la
   fermeture). On teste l'écriture au démarrage et on le dit à
   l'utilisateur plutôt que d'échouer en silence.
   ================================================================== */

const storageOK = (() => {
  try {
    localStorage.setItem("f1c.__t", "1");
    const ok = localStorage.getItem("f1c.__t") === "1";
    localStorage.removeItem("f1c.__t");
    return ok;
  } catch (e) { return false; }
})();

const store = {
  get(k, d) { if (!storageOK) return d; try { const v = localStorage.getItem("f1c." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { if (!storageOK) return; try { localStorage.setItem("f1c." + k, JSON.stringify(v)); } catch (e) {} }
};

/** Réglages encodés dans le hash de l'URL : un lien permanent qui
    survit à la navigation privée et se met en favori. */
function readHashSettings() {
  try {
    const m = /[#&]s=([A-Za-z0-9_-]+)/.exec(location.hash || "");
    if (!m) return null;
    const json = atob(m[1].replace(/-/g, "+").replace(/_/g, "/"));
    return JSON.parse(decodeURIComponent(escape(json)));
  } catch (e) { return null; }
}

function settingsLink() {
  const payload = { c: state.country, l: state.lang, s: state.subs, u: state.customUrls };
  const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(payload))))
    .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  return location.origin + location.pathname + location.search + "#s=" + b64;
}

const hashCfg = readHashSettings();

  /* Corrections d'URL saisies par l'utilisateur, par id de diffuseur.
     Elles priment sur LIVE_URLS et voyagent dans le lien de réglages. */

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

function flag(cc) {
  if (!/^[A-Za-z]{2}$/.test(cc)) return "🏁";
  return String.fromCodePoint(...[...cc.toUpperCase()].map(c => 0x1F1E6 + c.charCodeAt(0) - 65));
}
const countryName = cc => (COUNTRIES.find(c => c.cc === cc) || {}).name || cc;

function fmt(date, opts, tz) {
  const o = Object.assign({}, opts);
  if (tz) o.timeZone = tz;
  return new Intl.DateTimeFormat("fr-FR", o).format(date);
}
const hhmm     = (d, tz) => fmt(d, { hour:"2-digit", minute:"2-digit" }, tz);
const dayShort = (d, tz) => fmt(d, { weekday:"short", day:"numeric", month:"short" }, tz);
const dayLong  = (d, tz) => fmt(d, { weekday:"long", day:"numeric", month:"long" }, tz);

function allSessions() {
  const out = [];
  for (const rd of ROUNDS) {
    for (const k of ORDER) {
      if (!rd.s[k]) continue;
      const start = new Date(rd.s[k]);
      out.push({ round: rd, kind: k, start, end: new Date(start.getTime() + KINDS[k].mins * 60000) });
    }
  }
  return out.sort((a, b) => a.start - b.start);
}
const isLive = (s, now) => now >= s.start && now <= s.end;
const roundSessions = rd => ORDER.filter(k => rd.s[k]).map(k => {
  const start = new Date(rd.s[k]);
  return { round: rd, kind: k, start, end: new Date(start.getTime() + KINDS[k].mins * 60000) };
});
const roundEnd = rd => { const ss = roundSessions(rd); return ss.length ? ss[ss.length - 1].end : new Date(0); };

function current(now) {
  const all = allSessions();
  const live = all.find(s => isLive(s, now));
  if (live) return { s: live, live: true };
  const next = all.find(s => s.start > now);
  return next ? { s: next, live: false } : null;
}

function split(ms) {
  const t = Math.max(0, Math.floor(ms / 1000));
  return { d: Math.floor(t / 86400), h: Math.floor(t % 86400 / 3600), m: Math.floor(t % 3600 / 60), s: t % 60 };
}
const pad = n => String(n).padStart(2, "0");

const inCountry = (b, cc) => cc === "all" || b.cc === cc || (b.ccs && b.ccs.includes(cc));

function applies(b, kind, roundNo) {
  if (!b.covers.includes(kind)) return false;
  if (b.rounds && !b.rounds.includes(roundNo)) return false;
  if (b.id === "it-tv8" && kind === "sprint" && !SPRINT_ROUNDS.includes(roundNo)) return false;
  return true;
}

function sourcesFor(kind, roundNo) {
  const rank = { ok:0, likely:1, check:2 };
  return SOURCES
    .filter(b => inCountry(b, state.country))
    .filter(b => applies(b, kind, roundNo))
    .sort((a, b) => {
      const last = (b.id === state.lastSrc ? 1 : 0) - (a.id === state.lastSrc ? 1 : 0);
      if (last) return last;
      const owned = (state.subs.includes(b.id) ? 1 : 0) - (state.subs.includes(a.id) ? 1 : 0);
      if (owned) return owned;
      if (state.lang !== "all") {
        const pref = (b.lang === state.lang ? 1 : 0) - (a.lang === state.lang ? 1 : 0);
        if (pref) return pref;
      }
      if (rank[a.conf] !== rank[b.conf]) return rank[a.conf] - rank[b.conf];
      if (b.q !== a.q) return b.q - a.q;
      return a.name.localeCompare(b.name, "fr");
    });
}

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toast._h);
  toast._h = setTimeout(() => t.classList.remove("on"), 1900);
}

function srow(x, now) {
  const k = KINDS[x.kind];
  const past = x.end < now;
  const live = isLive(x, now);
  const free = sourcesFor(x.kind, x.round.r).some(b => b.kind === "free");
  return `
    <button class="srow ${k.key ? "key" : ""} ${past ? "past" : ""}" data-open="${x.round.r}:${x.kind}">
      <span class="srow-tag">${k.tag}</span>
      <span class="srow-day">${dayShort(x.start)}</span>
      ${free && !past ? `<span class="pill free">Gratuit</span>` : ""}
      ${live
        ? `<span class="srow-time"><span class="pill live"><span class="dot"></span>Direct</span></span>`
        : `<span class="srow-time">${hhmm(x.start)}</span>`}
    </button>`;
}

function renderCal() {
  const now = new Date();
  const list = state.past
    ? ROUNDS.filter(r => roundEnd(r) <= now).reverse()
    : ROUNDS.filter(r => roundEnd(r) > now);
  const nextR = current(now)?.s.round.r;

  $("s-cal").innerHTML = `
    <div class="stack-l">
      <div class="seg">
        <button data-past="0" aria-pressed="${!state.past}">À venir</button>
        <button data-past="1" aria-pressed="${state.past}">Terminées</button>
      </div>
      ${state.live ? "" : `
      <div class="notice"><span>◆</span>
        <div>Calendrier embarqué, figé au ${new Date(SNAPSHOT).toLocaleDateString("fr-FR")}. Fonctionne hors ligne mais ne suit pas un changement d'horaire décidé après cette date.</div>
      </div>`}
      <div class="stack-s">
        ${list.length ? list.map(rd => roundCard(rd, now, nextR)).join("") : `<div class="empty">Rien à afficher ici.</div>`}
      </div>
    </div>`;
}

function roundCard(rd, now, nextR) {
  const open = state.openRound === rd.r;
  const done = roundEnd(rd) <= now;
  const res = RESULTS.find(x => x.r === rd.r);

  return `
    <div class="round ${rd.r === nextR ? "next" : ""} ${done ? "done" : ""}" open-state="${open ? 1 : 0}">
      <button class="round-head" data-round="${rd.r}" aria-expanded="${open}">
        <div class="round-flag">${flag(rd.cc)}</div>

        ${roundSessions(rd).map(x => srow(x, now)).join("")}

    </div>`;
}

function openSheet(roundNo, kind) {
  state.sheet = { r: roundNo, kind };
  state.openSrc = null;
  renderSheet();
  $("sheet-bg").classList.add("on");
  $("sheet").classList.add("on");
  document.body.style.overflow = "hidden";
}

function closeSheet() {
  state.sheet = null;
  $("sheet-bg").classList.remove("on");
  $("sheet").classList.remove("on");
  document.body.style.overflow = "";
}

function qualityMeter(b) {
  const bars = [1, 2, 3].map(n => `<i class="${n <= b.q ? "fill" : ""}"></i>`).join("");
  return `<span class="qual"><span class="bars ${b.qSrc ? "" : "est"}">${bars}</span>
    <span class="qual-label">${esc(QUALITY[b.q])}${b.qSrc ? "" : " ?"}</span></span>`;
}

function sourceCard(b) {
  const owned  = state.subs.includes(b.id);

  const pinned = b.id === state.lastSrc;
  const open   = state.openSrc === b.id;
  const conf   = CONF[b.conf];
  const where  = b.ccs ? b.ccs.map(flag).join(" ") : `${flag(b.cc)} ${esc(countryName(b.cc))}`;
  const custom  = state.customUrls[b.id] || null;
  const target  = custom || LIVE_URLS[b.id] || b.url;
  const editing = state.editUrl === b.id;

  return `
    <div class="src ${owned ? "owned" : ""} ${pref ? "pref" : ""} ${pinned ? "pinned" : ""}" data-open="${open ? 1 : 0}">
      <button class="src-main" data-src="${b.id}" aria-expanded="${open}">
        <div class="src-id">
          <div class="src-name">${esc(b.name)}</div>
          <div class="src-where">${where}${pinned ? " · dernière utilisée" : ""}</div>
          <div class="src-tags">

  const start = new Date(rd.s[kind]);

  $("sheet").innerHTML = `

function renderWatchbar() {
  const now = new Date();
  const cur = current(now);
  const bar = $("watchbar");

  // Visible seulement quand c'est utile : en direct, ou à moins de 3 h.
  if (!cur || (!cur.live && cur.s.start - now > 3 * 3600 * 1000)) {
    bar.classList.remove("on");
    bar.innerHTML = "";
    return;
  }

  const k = KINDS[cur.s.kind];
  const c = split(cur.s.start - now);
  const sub = cur.live ? "en cours" : `dans ${c.h ? c.h + " h " : ""}${pad(c.m)} min`;

  bar.classList.add("on");
  bar.innerHTML = `
    <button data-open="${cur.s.round.r}:${cur.s.kind}">
      <span>${cur.live ? "● " : ""}Regarder ${esc(k.tag)}</span>
      <span class="sub">${esc(sub)}</span>
    </button>`;
}

function render() {
  $("zone").textContent = Intl.DateTimeFormat().resolvedOptions().timeZone;
  if (state.tab === "live")  renderLive();
  if (state.tab === "cal")   renderCal();
  if (state.tab === "stats") renderStats();
  if (state.tab === "set")   renderSet();
  renderWatchbar();
}

function show(tab) {
  state.tab = tab;
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("on"));
  $("s-" + tab).classList.add("on");
  document.querySelectorAll(".tabbar button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
  render();
  window.scrollTo(0, 0);
}

document.querySelector(".tabbar").onclick = e => {
  const b = e.target.closest("[data-tab]");
  if (b) show(b.dataset.tab);
};

$("watchbar").onclick = e => {
  const b = e.target.closest("[data-open]");
  if (b) { const [r, k] = b.dataset.open.split(":"); openSheet(Number(r), k); }
};

document.querySelector(".app").addEventListener("click", e => {
  const goto = e.target.closest("[data-goto]");
  if (goto) { show(goto.dataset.goto); return; }

  const open = e.target.closest("[data-open]");
  if (open) { const [r, k] = open.dataset.open.split(":"); openSheet(Number(r), k); return; }

  const round = e.target.closest("[data-round]");
  if (round) {
    const n = Number(round.dataset.round);
    state.openRound = state.openRound === n ? null : n;
    renderCal();
    return;
  }
  const past = e.target.closest("[data-past]");
  if (past) { state.past = past.dataset.past === "1"; state.openRound = null; renderCal(); return; }

  const stats = e.target.closest("[data-stats]");
  if (stats) { state.statsView = stats.dataset.stats; renderStats(); }
});

/* Actions dans la feuille : déplier une source, ouvrir, copier. */
$("sheet").addEventListener("click", async e => {
  const edit = e.target.closest("[data-edit]");
  if (edit) { state.editUrl = edit.dataset.edit; renderSheet(); $("urlin")?.focus(); return; }

  if (e.target.closest("[data-canceledit]")) { state.editUrl = null; renderSheet(); return; }

  const save = e.target.closest("[data-save]");
  if (save) {
    const val = ($("urlin")?.value || "").trim();
    if (!/^https?:\/\/.+/i.test(val)) { toast("URL invalide — elle doit commencer par https://"); return; }
    state.customUrls = Object.assign({}, state.customUrls, { [save.dataset.save]: val });
    store.set("customUrls", state.customUrls);
    state.editUrl = null;
    renderSheet();
    toast("Lien corrigé et mémorisé");
    return;
  }

  const reset = e.target.closest("[data-reset]");
  if (reset) {
    const next = Object.assign({}, state.customUrls);
    delete next[reset.dataset.reset];
    state.customUrls = next;
    store.set("customUrls", state.customUrls);
    renderSheet();
    toast("Lien par défaut rétabli");
    return;
  }

  const src = e.target.closest("[data-src]");
  if (src) {
    state.openSrc = state.openSrc === src.dataset.src ? null : src.dataset.src;
    state.editUrl = null;
    renderSheet();
    return;
  }
  const launch = e.target.closest("[data-launch]");
  if (launch) {
    state.lastSrc = launch.dataset.launch;
    store.set("lastSrc", state.lastSrc);
    return;   // on laisse le lien s'ouvrir normalement
  }
  const copy = e.target.closest("[data-copy]");
  if (copy) {
    try { await navigator.clipboard.writeText(copy.dataset.copy); toast("Lien copié"); }
    catch (err) { toast("Copie refusée par le navigateur"); }
  }
});

$("sheet-bg").onclick = closeSheet;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

setInterval(() => {
  if (state.tab === "live") renderLive();
  renderWatchbar();
}, 1000);

    losail:"Asia/Qatar", yas_marina:"Asia/Dubai"
  };
  const iso = b => (b && b.date && b.time) ? b.date + "T" + b.time.replace("Z", "") + "Z" : null;

  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 4000);
    const res = await fetch(`https://api.jolpi.ca/ergast/f1/${SEASON}/races/?format=json&limit=100`, { signal: ctrl.signal });
    clearTimeout(timer);
    if (!res.ok) return;

    const races = (await res.json())?.MRData?.RaceTable?.Races;
    if (!Array.isArray(races) || !races.length) return;

    const fresh = races.map(x => {
      const s = {};
      const map = [["fp1", x.FirstPractice], ["fp2", x.SecondPractice], ["fp3", x.ThirdPractice],
                   ["sq", x.SprintQualifying || x.SprintShootout], ["sprint", x.Sprint], ["q", x.Qualifying]];
      for (const [k, box] of map) { const v = iso(box); if (v) s[k] = v; }
      const r = iso({ date: x.date, time: x.time });
      if (r) s.race = r;
      if (!Object.keys(s).length) return null;
      const known = ROUNDS.find(o => o.r === Number(x.round));
      if (!known) return null;
      return Object.assign({}, known, { s, tz: TZ[x.Circuit?.circuitId] || known.tz });
    }).filter(Boolean);

    if (fresh.length < 10) return;
    ROUNDS.length = 0;
    ROUNDS.push(...fresh.sort((a, b) => a.r - b.r));
    state.live = true;
    render();
  } catch (e) { /* réseau bloqué : les données embarquées font le travail */ }
})();

show("live");

/* Raccourci : ouvrir la page sur #watch va droit à la séance courante.
   Permet une seconde icône d'écran d'accueil qui lance en un tap. */
if (/(^|[#&])watch/.test(location.hash)) {
  const cur = current(new Date());
  if (cur) openSheet(cur.s.round.r, cur.s.kind);
}
</script>
