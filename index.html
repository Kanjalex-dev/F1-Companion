<title>F1 Companion</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Saira:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">

<style>
/* ------------------------------------------------------------------
   F1 Companion — page unique, autonome, sans dépendance réseau.
   Thème sombre unique et assumé : c'est le monde visuel de la F1.
   Toutes les couleurs sont peintes en dur pour que la page tienne
   quel que soit le fond de l'hôte.
   ------------------------------------------------------------------ */
:root {
  --ink:        #0A0A0E;
  --surface:    #14141C;
  --surface-2:  #1D1D28;
  --line:       #2B2B3A;
  --red:        #E10600;
  --red-dim:    #8E0400;
  --text:       #F2F2F5;
  --muted:      #9494A6;   /* remonté depuis #8B8B9C : contraste des micro-labels */
  --live:       #00D26A;
  --warn:       #FFB020;

  --display: "Saira Condensed", "Arial Narrow", system-ui, sans-serif;
  --body:    "Saira", system-ui, -apple-system, sans-serif;
  --mono:    "JetBrains Mono", ui-monospace, "SF Mono", monospace;

  --tabbar: 62px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ink);
  color: var(--text);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; border-radius: 4px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ---------- Ossature ---------- */

.app {
  max-width: 540px; margin: 0 auto;
  padding: 0 16px calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 78px);
  min-height: 100vh;
}

.topbar {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 12px; padding: 18px 0 14px;
}
.wordmark { font-family: var(--display); font-weight: 800; font-size: 25px; letter-spacing: -.02em; line-height: 1; }
.wordmark span { color: var(--red); }
.zone { font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--muted); }

.screen { display: none; }
.screen.on { display: block; }

/* ---------- Barre d'onglets ---------- */

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: flex;
  background: rgba(10,10,14,.94); backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabbar button {
  flex: 1; height: var(--tabbar);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--muted); font-size: 10px; font-weight: 600;
  letter-spacing: .03em; text-transform: uppercase; transition: color .15s;
}
.tabbar button[aria-selected="true"] { color: var(--text); }
.tabbar button[aria-selected="true"] .glyph { color: var(--red); }
.tabbar svg { width: 21px; height: 21px; display: block; }
.tabbar button[aria-selected="true"] svg { color: var(--red); }

/* ---------- Barre d'action « Regarder » ----------
   Persistante dès qu'une séance est en cours ou imminente : c'est le
   raccourci qui évite les trois taps pour lancer un diffuseur. */
.watchbar {
  position: fixed; left: 0; right: 0;
  bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px));
  z-index: 41;
  max-width: 540px; margin: 0 auto; padding: 8px 16px;
  display: none;
}
.watchbar.on { display: block; }
.watchbar button {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  width: 100%; padding: 12px 15px; border-radius: 11px;
  background: var(--red); color: #fff;
  font-family: var(--display); font-weight: 700; font-size: 15.5px;
  letter-spacing: .04em; text-transform: uppercase;
  box-shadow: 0 6px 20px rgba(0,0,0,.45);
}
.watchbar .sub {
  font-family: var(--mono); font-size: 11px; font-weight: 500;
  letter-spacing: 0; text-transform: none; opacity: .85;
}

/* ---------- Blocs ---------- */

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }

.eyebrow {
  font-family: var(--display); font-weight: 700; font-size: 11.5px;
  letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
}

.hero {
  position: relative; overflow: hidden;
  background: radial-gradient(120% 100% at 100% 0%, rgba(225,6,0,.20), transparent 62%), var(--surface-2);
  border: 1px solid var(--line); border-radius: 16px; padding: 18px;
  display: flex; flex-direction: column; gap: 14px;
}
.hero::before { content:""; position:absolute; inset:0 auto 0 0; width:4px;
  background:repeating-linear-gradient(180deg, var(--red) 0 14px, #F2F2F5 14px 28px); }
.hero-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.hero-flag { font-size: 30px; line-height: 1; }

.session-name {
  font-family: var(--display); font-weight: 800; font-size: 38px;
  line-height: .96; letter-spacing: -.01em; text-wrap: balance; margin: 0;
}
.gp-name { font-size: 14px; font-weight: 600; color: var(--muted); margin-top: 5px; }

/* ---------- En-tete contextuel « mur des stands » ----------
   Le bandeau de marque ne disait rien : il repetait le nom de l'app que
   l'on vient d'ouvrir. Il porte desormais la manche en cours. */
.pit-top { display: flex; align-items: center; gap: 10px; padding: 16px 0 0; }
.pit-rd  { font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .1em; color: var(--muted); }
.pit-rd em { font-style: normal; color: var(--warn); }
.pit-gp  { font-family: var(--display); font-weight: 800; font-size: 17px; letter-spacing: .01em; line-height: 1.05; }
.pit-flag{ font-size: 19px; line-height: 1; flex: none; }
.pit-gear{
  margin-left: auto; flex: none; width: 40px; height: 40px;
  display: grid; place-items: center; border-radius: 50%;
  background: var(--surface); color: var(--muted);
}
.pit-gear:hover { color: var(--text); }

/* ---------- Rail de week-end ----------
   Cinq segments, un par seance : ou l'on en est, et un raccourci vers
   chacune. C'est ce qui remplace le scroll pour changer de seance. */
.rail { display: flex; gap: 4px; margin-top: 12px; }
.rail button {
  flex: 1; min-width: 0; padding: 7px 2px 6px; border-radius: 7px; text-align: center;
  background: var(--surface); border: 1px solid var(--line); transition: border-color .15s, background .15s;
}
.rail .rk { display: block; font-family: var(--display); font-weight: 700; font-size: 11px; letter-spacing: .06em; color: var(--muted); line-height: 1; }
.rail .rt { display: block; font-family: var(--mono); font-size: 10px; font-weight: 500; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
.rail button.done { opacity: .4; }
.rail button.key .rk { color: #D6D6DE; }
.rail button.now { background: var(--surface-2); border-color: var(--red); }
.rail button.now .rk, .rail button.now .rt { color: var(--text); }

/* ---------- Chrono en ligne de timing ----------
   Quatre boites bordees coutaient 62px pour quatre nombres. Les secondes
   n'apparaissent que sous l'heure : au-dela elles ne decident rien et
   c'etait le seul mouvement gratuit de l'ecran. */
.chrono { display: flex; align-items: flex-end; font-family: var(--mono); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.chrono .n   { font-size: 33px; }
.chrono .sep { font-size: 27px; color: var(--muted); padding: 0 3px; transform: translateY(-1px); }
.chrono .u   { font-family: var(--body); font-size: 9.5px; font-weight: 600; letter-spacing: .09em; color: var(--muted); padding-left: 2px; transform: translateY(-6px); }

.hrs { display: flex; gap: 8px; }
.hr  { flex: 1; min-width: 0; background: rgba(0,0,0,.3); border: 1px solid var(--line); border-radius: 9px; padding: 7px 9px; }
.hr .lbl { font-size: 9.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.hr .val { font-family: var(--mono); font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }

/* ---------- Liste a plat ----------
   La liste des seances etait une carte dans une carte : quatre niveaux
   de fond empiles, la charte en autorise trois. */
.sechead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.seccount { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
.flat { display: flex; flex-direction: column; }
.frow { display: flex; align-items: center; gap: 11px; width: 100%; padding: 10px 2px; min-height: 44px; text-align: left; transition: background .13s; border-radius: 8px; }
.frow + .frow { border-top: 1px solid rgba(43,43,58,.75); }
.frow:hover { background: rgba(255,255,255,.03); }
.ftag { font-family: var(--display); font-weight: 700; font-size: 12.5px; letter-spacing: .05em; width: 60px; flex: none; color: var(--muted); }
.frow.key .ftag { color: var(--text); }
.fday { font-size: 12px; color: var(--muted); }
.ftime { margin-left: auto; font-family: var(--mono); font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; }
.fsrc { flex: none; font-size: 9.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; width: 56px; text-align: right; color: var(--live); }
.fsrc.pay { color: var(--warn); }
.fsrc.none { color: var(--muted); }
.frow.past { opacity: .45; }

.champrow { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 2px; text-align: left; }
.cpos { font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--red); width: 22px; flex: none; }

.times { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.times div { display: flex; justify-content: space-between; gap: 12px; }
.times span:first-child { color: var(--muted); }
.times b { font-family: var(--mono); font-weight: 500; font-variant-numeric: tabular-nums; }

.cta {
  display: flex; align-items: center; justify-content: space-between; width: 100%;
  background: var(--red); color: #fff;
  font-family: var(--display); font-weight: 700; font-size: 16px;
  letter-spacing: .04em; text-transform: uppercase;
  padding: 12px 15px; border-radius: 10px; transition: background .15s;
}
.cta:hover { background: #c60500; }

/* ---------- Pastilles ---------- */

.pill {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 5px; white-space: nowrap;
}
.pill.live  { color: var(--live); background: rgba(0,210,106,.13); }
.pill.free  { color: var(--live); background: rgba(0,210,106,.13); }
.pill.warn  { color: var(--warn); background: rgba(255,176,32,.13); }
.pill.lang  { color: #fff;        background: var(--red); }
.pill.quiet { color: var(--muted); background: rgba(148,148,166,.15); }
.pill.owned { color: var(--live); background: rgba(0,210,106,.13); }

.dot { width:6px; height:6px; border-radius:50%; background:currentColor; animation: blink 1.7s ease-in-out infinite; }
@keyframes blink { 0%,100% { opacity:1 } 50% { opacity:.3 } }

/* ---------- Indicateur de qualité ---------- */

.qual { display: inline-flex; align-items: center; gap: 6px; }
.bars { display: inline-flex; gap: 2px; align-items: flex-end; }
.bars i { display: block; width: 4px; border-radius: 1px; background: var(--line); }
.bars i:nth-child(1) { height: 6px; }
.bars i:nth-child(2) { height: 9px; }
.bars i:nth-child(3) { height: 12px; }
.bars i.fill { background: var(--text); }
.bars.est i.fill { background: var(--muted); }
.qual-label { font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--muted); }

/* ---------- Segmenté ---------- */

.seg {
  display: flex; gap: 3px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; padding: 3px;
}
.seg button {
  flex: 1; padding: 7px 4px; min-height: 40px; border-radius: 7px;
  font-size: 12.5px; font-weight: 600; color: var(--muted);
  transition: background .15s, color .15s;
}
.seg button[aria-pressed="true"] { background: var(--red); color: #fff; }
.segnum {
  display: inline-block; margin-left: 4px;
  font-family: var(--mono); font-size: 10.5px; font-weight: 500; opacity: .7;
}

/* ---------- Verdict ----------
   Couleur sémantique, distincte du rouge d'accent : elle encode un
   état (couvert / gratuit / à payer), pas une mise en avant. */
.verdict {
  display: flex; align-items: flex-start; gap: 11px;
  padding: 13px 14px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface);
}
.verdict-mark { font-size: 13px; line-height: 1.5; flex: none; }
.verdict-title { font-family: var(--display); font-weight: 700; font-size: 16px; line-height: 1.2; }
.verdict-detail { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.45; }
.verdict-go {
  flex: none; align-self: center;
  padding: 8px 12px; min-height: 40px; border-radius: 9px;
  font-size: 13px; font-weight: 600;
  background: var(--red); color: #fff;
}
.verdict-go:hover { background: #c60500; }

.verdict.v-ok   { border-color: rgba(0,210,106,.38); background: rgba(0,210,106,.07); }
.verdict.v-ok   .verdict-mark { color: var(--live); }
.verdict.v-free { border-color: rgba(0,210,106,.22); }
.verdict.v-free .verdict-mark { color: var(--live); }
.verdict.v-pay  { border-color: rgba(255,176,32,.30); background: rgba(255,176,32,.05); }
.verdict.v-pay  .verdict-mark { color: var(--warn); }
.verdict.v-none .verdict-mark { color: var(--muted); }

/* Variante compacte : le verdict remonte dans le hero, pour que
   « est-ce que je peux la voir » ne coute plus trois taps. */
.verdict.compact { padding: 11px 12px; gap: 10px; align-items: center; }
.verdict.compact .verdict-title  { font-size: 15px; }
.verdict.compact .verdict-detail { font-size: 11.5px; margin-top: 1px; }

/* ---------- Manches ---------- */

.round { background: var(--surface); border: 1px solid var(--line); border-radius: 13px; overflow: hidden; }
.round.next { border-color: var(--red-dim); background: var(--surface-2); }
.round.done .round-head { opacity: .52; }

.round-head { display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 14px; text-align: left; }
.round-flag { font-size: 26px; line-height: 1; }
.round-id { font-family: var(--mono); font-size: 10.5px; font-weight: 700; color: var(--muted); letter-spacing: .06em; }
.round-title { font-family: var(--display); font-weight: 700; font-size: 18px; line-height: 1.1; }
.round-sub { font-size: 11.5px; color: var(--muted); }
.round-when {
  margin-left: auto; text-align: right; font-family: var(--mono);
  font-size: 11.5px; font-weight: 500; color: var(--muted); white-space: nowrap;
}
.chev { color: var(--muted); font-size: 12px; transition: transform .2s; }
.round[open-state="1"] .chev { transform: rotate(90deg); }

.sessions { border-top: 1px solid var(--line); padding: 4px 6px 6px; }

.srow {
  display: flex; align-items: center; gap: 11px; width: 100%;
  padding: 10px 8px; text-align: left; border-radius: 9px; transition: background .13s;
}
.srow:hover { background: rgba(255,255,255,.035); }
.srow + .srow { border-top: 1px solid rgba(43,43,58,.6); }
.srow-tag {
  font-family: var(--display); font-weight: 700; font-size: 12px;
  letter-spacing: .05em; width: 62px; flex: none; color: var(--muted);
}
.srow.key .srow-tag { color: var(--text); }
.srow-day { font-size: 12px; color: var(--muted); }
.srow-time { margin-left: auto; font-family: var(--mono); font-size: 13.5px; font-weight: 500; font-variant-numeric: tabular-nums; }
.srow.past { opacity: .45; }

/* ---------- Feuille de séance ---------- */

.sheet-bg { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.62); backdrop-filter: blur(3px); display: none; }
.sheet-bg.on { display: block; }

.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 51;
  max-height: 92vh; max-width: 540px; margin: 0 auto;
  background: var(--ink); border: 1px solid var(--line); border-bottom: 0;
  border-radius: 18px 18px 0 0;
  overflow-y: auto; overscroll-behavior: contain;
  transform: translateY(100%);
  transition: transform .26s cubic-bezier(.32,.72,0,1);
  padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 24px);
}
.sheet.on { transform: translateY(0); }

.sheet-bar {
  position: sticky; top: 0; z-index: 2; background: var(--ink); padding: 12px 0 10px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  border-bottom: 1px solid var(--line); margin-bottom: 14px;
}
.close {
  width: 40px; height: 40px; flex: none; border-radius: 50%;
  background: var(--surface-2); color: var(--muted); font-size: 15px; line-height: 1;
}

/* ---------- Diffuseurs ----------
   Carte compacte : le détail (note, géo) est replié derrière un tap.
   Avec le filtre « tous pays », une course peut lister 20 sources —
   la version dépliée en permanence était un mur de texte. */

.src { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.src.owned { border-color: rgba(0,210,106,.35); }
.src.pref  { border-color: rgba(225,6,0,.4); }
.src.pinned { border-color: var(--red); background: var(--surface-2); }

.src-main { display: flex; align-items: center; gap: 11px; width: 100%; padding: 12px 14px; text-align: left; }
.src-id { min-width: 0; }
.src-name { font-family: var(--display); font-weight: 700; font-size: 17px; line-height: 1.15; }
.src-where { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
.src-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 7px; }
.src-more { margin-left: auto; flex: none; color: var(--muted); font-size: 12px; transition: transform .2s; }
.src[data-open="1"] .src-more { transform: rotate(90deg); }

.src-detail { padding: 0 14px 12px; border-top: 1px solid var(--line); margin-top: -1px; padding-top: 12px; }
.src-scope { font-size: 12.5px; }
.src-geo { font-size: 11.5px; color: var(--warn); margin-top: 6px; }
.src-note { font-size: 11.5px; color: var(--muted); margin-top: 6px; line-height: 1.45; }

.src-actions { display: flex; gap: 8px; padding: 0 14px 12px; }
.src-actions > * {
  flex: 1; text-align: center; padding: 9px 10px; min-height: 40px; border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600;
  border: 1px solid var(--line); background: var(--surface-2);
}
.src-actions .go { background: var(--red); border-color: var(--red); color: #fff; }
.src-actions .go:hover { background: #c60500; }

.urlbox {
  margin-top: 12px; padding: 11px 12px;
  background: rgba(0,0,0,.28); border: 1px solid var(--line); border-radius: 10px;
}
.urlbox-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.urledit { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; }
.urledit input {
  width: 100%; background: var(--surface-2); color: var(--text);
  border: 1px solid var(--line); border-radius: 9px;
  padding: 10px 11px; font-family: var(--mono); font-size: 12.5px;
}

/* ---------- Classements ----------
   Une seule mesure (les points), donc une seule teinte : l'identité de
   l'écurie est portée par le texte, pas par la couleur. Onze teintes
   catégorielles seraient indistinguables et invalidables. */

.rank { display: flex; flex-direction: column; }
.rank-row {
  display: grid;
  grid-template-columns: 26px 1fr auto;
  align-items: center; gap: 10px;
  padding: 9px 0;
}
.rank-row + .rank-row { border-top: 1px solid rgba(43,43,58,.7); }
.rank-pos {
  font-family: var(--mono); font-size: 13px; font-weight: 700;
  color: var(--muted); font-variant-numeric: tabular-nums; text-align: right;
}
.rank-row.lead .rank-pos { color: var(--red); }
.rank-who { min-width: 0; }
.rank-name { font-family: var(--display); font-weight: 700; font-size: 16px; line-height: 1.15; }
.rank-team { font-size: 11.5px; color: var(--muted); }
.rank-val {
  font-family: var(--mono); font-size: 15px; font-weight: 700;
  font-variant-numeric: tabular-nums; text-align: right;
}
.rank-sub { font-family: var(--mono); font-size: 10.5px; color: var(--muted); text-align: right; }

/* Barre de magnitude : extrémité arrondie, ancrée à la ligne de base,
   2px de fond entre la barre et la piste. */
.track { grid-column: 2 / 4; height: 4px; background: rgba(148,148,166,.16); border-radius: 2px; margin-top: 2px; }
.track > span { display: block; height: 100%; background: var(--red); border-radius: 2px; }
.rank-row:not(.lead) .track > span { background: #7A3B38; }

.podium { display: flex; align-items: center; gap: 10px; padding: 9px 0; }
.podium + .podium { border-top: 1px solid rgba(43,43,58,.7); }
.podium-rd { font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--muted); width: 26px; flex: none; }
.podium-gp { font-size: 13px; min-width: 0; }
.podium-win { margin-left: auto; text-align: right; }
.podium-drv { font-family: var(--display); font-weight: 700; font-size: 15px; }
.podium-meta { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }

/* ---------- Réglages ---------- */

.field { display: flex; flex-direction: column; gap: 7px; }
.field > label { font-size: 12px; font-weight: 600; color: var(--muted); }
select {
  width: 100%; background: var(--surface-2); color: var(--text);
  border: 1px solid var(--line); border-radius: 10px;
  padding: 11px 12px; font: inherit; font-size: 15px; appearance: none;
}
select.compact { padding: 8px 10px; font-size: 13px; }

.checks { display: flex; flex-direction: column; gap: 2px; }
.check { display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px 12px; border-radius: 10px; text-align: left; font-size: 14.5px; }
.check:hover { background: rgba(255,255,255,.035); }
.box {
  width: 19px; height: 19px; flex: none; border: 1.5px solid var(--line);
  border-radius: 5px; display: grid; place-items: center; font-size: 11px; color: transparent;
}
.check[aria-pressed="true"] .box { background: var(--red); border-color: var(--red); color: #fff; }

.btn {
  display: block; width: 100%; text-align: center;
  padding: 11px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface-2);
  font-size: 14px; font-weight: 600;
}
.btn:hover { background: #262634; }

.prose { font-size: 12.5px; color: var(--muted); line-height: 1.55; }
.prose strong { color: var(--text); font-weight: 600; }
.prose ol, .prose ul { margin: 8px 0 0; padding-left: 18px; }
.prose li { margin-bottom: 4px; }

.notice {
  display: flex; gap: 10px; border-radius: 11px; padding: 12px 13px;
  font-size: 12.5px; line-height: 1.45;
  background: rgba(255,176,32,.09); border: 1px solid rgba(255,176,32,.26); color: var(--warn);
}
.notice.ok { background: rgba(0,210,106,.08); border-color: rgba(0,210,106,.26); color: var(--live); }

.stack-s { display: flex; flex-direction: column; gap: 8px; }
.stack-l { display: flex; flex-direction: column; gap: 22px; }
.sec     { display: flex; flex-direction: column; gap: 10px; }
.empty   { text-align: center; padding: 46px 20px; color: var(--muted); font-size: 13.5px; }
.grouphead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.groupcount { font-family: var(--mono); font-size: 11px; color: var(--muted); }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%) translateY(20px);
  bottom: calc(var(--tabbar) + 90px); z-index: 60;
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 16px; font-size: 13px; font-weight: 600;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
}
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
/* ---------- Analyse de seance (OpenF1) ----------
   Donnees post-seance : l'acces temps reel d'OpenF1 est payant, le
   reste est gratuit. Tout arrive une fois la seance terminee. */

.sheet.full { max-height: 100vh; height: 100vh; border-radius: 0; top: 0; }
.ana-bar { display: flex; align-items: center; gap: 12px; }
.ana-back { width: 40px; height: 40px; flex: none; border-radius: 50%; background: var(--surface-2); color: var(--muted); display: grid; place-items: center; }
.ana-title { font-family: var(--display); font-weight: 800; font-size: 19px; line-height: 1.1; }
.ana-sub { font-size: 11.5px; color: var(--muted); }

.viz { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 13px 12px 10px; }
.viz svg { display: block; width: 100%; height: auto; }
.viz .grid line { stroke: var(--line); stroke-width: 1; }
.viz .axis { font-family: var(--mono); font-size: 9.5px; fill: var(--muted); }
.viz .serie { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.viz .cross { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
.viz .hit { fill: transparent; }
.viz .pt { stroke: var(--surface); stroke-width: 2; }

.legend { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
.legend button {
  display: inline-flex; align-items: center; gap: 6px; min-height: 40px;
  padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface-2); font-size: 12.5px; font-weight: 600;
}
.legend button[aria-pressed="false"] { opacity: .42; }
.legend .swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.legend .code { font-family: var(--mono); font-weight: 700; font-size: 12px; }

.tip {
  position: absolute; z-index: 3; pointer-events: none;
  background: var(--ink); border: 1px solid var(--line); border-radius: 9px;
  padding: 8px 10px; font-size: 12px; min-width: 112px;
  box-shadow: 0 8px 22px rgba(0,0,0,.5);
}
.tip .lap { font-family: var(--mono); font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: .06em; }
.tip .row { display: flex; align-items: center; gap: 7px; margin-top: 5px; }
.tip .row b { margin-left: auto; font-family: var(--mono); font-weight: 700; font-variant-numeric: tabular-nums; }

/* Relais : le code couleur pneu est universel, chaque segment porte sa
   lettre — l'identite n'est jamais portee par la couleur seule. */
.stints { display: flex; flex-direction: column; gap: 3px; }
.stint-row { display: flex; align-items: center; gap: 9px; }
.stint-who { width: 42px; flex: none; font-family: var(--mono); font-size: 11px; font-weight: 700; }
.stint-bars { display: flex; flex: 1; min-width: 0; gap: 2px; height: 20px; }
.stint-seg {
  display: grid; place-items: center; border-radius: 3px; min-width: 0;
  font-family: var(--mono); font-size: 9.5px; font-weight: 700; color: #0A0A0E;
}
.stint-seg.dark { color: #F2F2F5; }
.tyrekey { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; font-size: 11px; color: var(--muted); }
.tyrekey span { display: inline-flex; align-items: center; gap: 5px; }
.tyrekey i { width: 9px; height: 9px; border-radius: 2px; display: block; }

.sect { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.sect th { font-family: var(--display); font-weight: 700; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: right; padding: 0 0 7px; }
.sect th:first-child { text-align: left; }
.sect td { padding: 8px 0; border-top: 1px solid rgba(43,43,58,.7); text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.sect td:first-child { text-align: left; font-family: var(--display); font-weight: 700; font-size: 14px; }
.sect td.best { color: var(--live); }

.loading { text-align: center; padding: 28px 16px; color: var(--muted); font-size: 13px; }

/** Réglages encodés dans le hash de l'URL : un lien permanent qui
    survit à la navigation privée et se met en favori. */
function readHashSettings() {
  try {
    const m = /[#&]s=([A-Za-z0-9_-]+)/.exec(location.hash || "");
    if (!m) return null;
    const json = atob(m[1].replace(/-/g, "+").replace(/_/g, "/"));
    return JSON.parse(decodeURIComponent(escape(json)));
  } catch (e) { return null; }
}

function settingsLink() {
  const payload = { c: state.country, l: state.lang, s: state.subs, u: state.customUrls };
  const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(payload))))
    .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  return location.origin + location.pathname + location.search + "#s=" + b64;
}

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

function flag(cc) {
  if (!/^[A-Za-z]{2}$/.test(cc)) return "🏁";
  return String.fromCodePoint(...[...cc.toUpperCase()].map(c => 0x1F1E6 + c.charCodeAt(0) - 65));
}
const countryName = cc => (COUNTRIES.find(c => c.cc === cc) || {}).name || cc;

function fmt(date, opts, tz) {
  const o = Object.assign({}, opts);
  if (tz) o.timeZone = tz;
  return new Intl.DateTimeFormat("fr-FR", o).format(date);
}
const hhmm     = (d, tz) => fmt(d, { hour:"2-digit", minute:"2-digit" }, tz);
const dayShort = (d, tz) => fmt(d, { weekday:"short", day:"numeric", month:"short" }, tz);
const dayLong  = (d, tz) => fmt(d, { weekday:"long", day:"numeric", month:"long" }, tz);

function allSessions() {
  const out = [];
  for (const rd of ROUNDS) {
    for (const k of ORDER) {
      if (!rd.s[k]) continue;
      const start = new Date(rd.s[k]);
      out.push({ round: rd, kind: k, start, end: new Date(start.getTime() + KINDS[k].mins * 60000) });
    }
  }
  return out.sort((a, b) => a.start - b.start);
}
const isLive = (s, now) => now >= s.start && now <= s.end;
const roundSessions = rd => ORDER.filter(k => rd.s[k]).map(k => {
  const start = new Date(rd.s[k]);
  return { round: rd, kind: k, start, end: new Date(start.getTime() + KINDS[k].mins * 60000) };
});
const roundEnd = rd => { const ss = roundSessions(rd); return ss.length ? ss[ss.length - 1].end : new Date(0); };

function current(now) {
  const all = allSessions();
  const live = all.find(s => isLive(s, now));
  if (live) return { s: live, live: true };
  const next = all.find(s => s.start > now);
  return next ? { s: next, live: false } : null;
}

function split(ms) {
  const t = Math.max(0, Math.floor(ms / 1000));
  return { d: Math.floor(t / 86400), h: Math.floor(t % 86400 / 3600), m: Math.floor(t % 3600 / 60), s: t % 60 };
}
const pad = n => String(n).padStart(2, "0");

const inCountry = (b, cc) => cc === "all" || b.cc === cc || (b.ccs && b.ccs.includes(cc));

function applies(b, kind, roundNo) {
  if (!b.covers.includes(kind)) return false;
  if (b.rounds && !b.rounds.includes(roundNo)) return false;
  if (b.id === "it-tv8" && kind === "sprint" && !SPRINT_ROUNDS.includes(roundNo)) return false;
  return true;
}

    .filter(b => inCountry(b, state.country))
    .filter(b => applies(b, kind, roundNo))
    .sort((a, b) => {
      const last = (b.id === state.lastSrc ? 1 : 0) - (a.id === state.lastSrc ? 1 : 0);
      if (last) return last;
      const owned = (state.subs.includes(b.id) ? 1 : 0) - (state.subs.includes(a.id) ? 1 : 0);
      if (owned) return owned;
      if (state.lang !== "all") {
        const pref = (b.lang === state.lang ? 1 : 0) - (a.lang === state.lang ? 1 : 0);
        if (pref) return pref;
      }
      if (rank[a.conf] !== rank[b.conf]) return rank[a.conf] - rank[b.conf];
      if (b.q !== a.q) return b.q - a.q;
      return a.name.localeCompare(b.name, "fr");
    });
}

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toast._h);
  toast._h = setTimeout(() => t.classList.remove("on"), 1900);
}

/* ==================================================================
   EXPORT CALENDRIER (.ics)

   Remplace les notifications locales perdues en quittant le natif :
   une fois importé, iOS gère les alertes lui-même, sans que l'app
   soit ouverte. Format RFC 5545 — fins de ligne CRLF et repliement
   des lignes à 75 octets, sinon certains clients refusent le fichier.
   ================================================================== */

const ICS_SCOPES = {
  key:  { label: "Qualifs, Sprint, Course", kinds: ["sq", "sprint", "q", "race"] },
  race: { label: "Courses uniquement",      kinds: ["sprint", "race"] },
  all:  { label: "Toutes les séances",      kinds: ORDER }
};

/** Échappement des valeurs texte iCalendar. */
const icsEsc = s => String(s)
  .replace(/\\/g, "\\\\").replace(/;/g, "\\;")
  .replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");

/** Repliement à 75 octets : la suite d'une ligne commence par une espace. */
function icsFold(line) {
  const bytes = new TextEncoder().encode(line);
  if (bytes.length <= 75) return line;
  const out = [];
  let cur = "";
  let len = 0;
  for (const ch of line) {
    const n = new TextEncoder().encode(ch).length;
    if (len + n > (out.length ? 74 : 75)) { out.push(cur); cur = ""; len = 0; }
    cur += ch; len += n;
  }
  if (cur) out.push(cur);
  return out.join("\r\n ");
}

const icsStamp = d => d.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");

function buildICS() {
  const scope = ICS_SCOPES[state.icsScope] || ICS_SCOPES.key;
  const now = new Date();
  const lines = [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//F1 Companion//FR//",
    "CALSCALE:GREGORIAN",
    "METHOD:PUBLISH",
    `X-WR-CALNAME:Formule 1 ${SEASON}`,
    "X-WR-TIMEZONE:UTC"
  ];

  let count = 0;
  for (const rd of ROUNDS) {
    for (const k of ORDER) {
      if (!rd.s[k] || !scope.kinds.includes(k)) continue;
      const start = new Date(rd.s[k]);
      const end = new Date(start.getTime() + KINDS[k].mins * 60000);
      const gp = rd.name.replace("Grand Prix ", "GP ");

      lines.push("BEGIN:VEVENT");
      // UID stable : un ré-import met à jour au lieu de dupliquer.
      lines.push(`UID:${SEASON}-r${rd.r}-${k}@f1companion`);
      lines.push(`DTSTAMP:${icsStamp(now)}`);
      lines.push(`DTSTART:${icsStamp(start)}`);
      lines.push(`DTEND:${icsStamp(end)}`);
      lines.push(icsFold(`SUMMARY:${icsEsc(`${KINDS[k].tag} · ${gp}`)}`));
      lines.push(icsFold(`LOCATION:${icsEsc(`${rd.circuit}, ${rd.city}`)}`));
      lines.push(icsFold(`DESCRIPTION:${icsEsc(
        `${KINDS[k].long} — manche ${rd.r} sur 23.\n` +
        `Heure au circuit : ${hhmm(start, rd.tz)} (${rd.tz}).\n` +
        `Durée nominale : ${KINDS[k].mins} min.`
      )}`));
      lines.push("TRANSP:TRANSPARENT");
      if (state.icsAlarm > 0) {
        lines.push("BEGIN:VALARM", "ACTION:DISPLAY",
          icsFold(`DESCRIPTION:${icsEsc(`${KINDS[k].tag} · ${gp}`)}`),
          `TRIGGER:-PT${state.icsAlarm}M`, "END:VALARM");
      }
      lines.push("END:VEVENT");
      count++;
    }
  }
  lines.push("END:VCALENDAR");
  return { ics: lines.join("\r\n") + "\r\n", count };
}

function downloadICS() {
  const { ics, count } = buildICS();
  try {
    const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `f1-${SEASON}.ics`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 8000);
    toast(`${count} séances exportées`);
  } catch (e) {
    toast("Export refusé par le navigateur");
  }
}

/* ==================================================================
   VERDICT — « est-ce que je peux regarder ça ? »

   L'écran montrait vingt sources dont une seule concerne l'utilisateur.
   Ce verdict répond à la seule question qui compte, en une phrase, en
   croisant ses abonnements et le pays sélectionné.
   ================================================================== */

function verdict(kind, roundNo) {
  const all = SOURCES
    .filter(b => inCountry(b, state.country))
    .filter(b => applies(b, kind, roundNo));

  const mine = all.filter(b => state.subs.includes(b.id));
  const free = all.filter(b => b.kind === "free");

  if (mine.length) {
    return { level: "ok", src: mine[0],
      title: `${mine[0].name} diffuse cette séance`,
      detail: mine.length > 1
        ? `Et ${mine.length - 1} autre${mine.length > 2 ? "s" : ""} de tes abonnements.`
        : "C'est dans ce que tu paies déjà." };
  }
  if (free.length) {
    return { level: "free", src: free[0],
      title: `${free.length} chaîne${free.length > 1 ? "s" : ""} gratuite${free.length > 1 ? "s" : ""}`,
      detail: `Aucun de tes abonnements ne la couvre. ${free[0].name} la diffuse — accessible depuis ${free[0].geo}.` };
  }
  if (all.length) {
    return { level: "pay", src: all[0],
      title: "Abonnement supplémentaire requis",
      detail: `Ni tes abonnements ni une chaîne gratuite ne couvrent cette séance. ${all.length} source${all.length > 1 ? "s" : ""} payante${all.length > 1 ? "s" : ""} la diffuse${all.length > 1 ? "nt" : ""}.` };
  }
  return { level: "none", src: null,
    title: "Aucune source référencée",
    detail: state.country === "all"
      ? "Aucun diffuseur connu pour cette séance."
      : "Aucun diffuseur connu pour cette séance dans ce pays. Essaie « Tous les pays »." };
}

function renderTopbar() {
  const el = $("topbar");
  const now = new Date();
  const cur = state.tab === "live" ? current(now) : null;
  const gear = `<button class="pit-gear" data-goto="set" aria-label="Réglages">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 7.2h4.4M13.2 7.2H20M4 16.8h8.4M17.2 16.8H20"/><circle cx="10.8" cy="7.2" r="2.4"/><circle cx="14.8" cy="16.8" r="2.4"/></svg>
    </button>`;

  if (!cur) {
    el.innerHTML = `<div class="pit-top">
        <div class="wordmark">F1&nbsp;<span>COMPANION</span></div>${gear}
      </div>`;
    return;
  }
  const rd = cur.s.round;
  const sprint = !!rd.s.sprint;
  el.innerHTML = `
    <div class="pit-top">
      <span class="pit-flag">${flag(rd.cc)}</span>
      <div style="min-width:0">
        <div class="pit-rd">MANCHE ${rd.r}${sprint ? " · <em>SPRINT</em>" : ""}</div>
        <div class="pit-gp">${esc(rd.city.toUpperCase())}</div>
      </div>
      ${gear}
    </div>
    <div class="rail">${roundSessions(rd).map(x => railSeg(x, cur.s, now)).join("")}</div>`;
}

function railSeg(x, currentSession, now) {
  const k = KINDS[x.kind];
  const past = x.end < now;
  const isNow = x === currentSession;
  const cls = [isNow ? "now" : "", past && !isNow ? "done" : "", k.key ? "key" : ""].filter(Boolean).join(" ");
  return `<button class="${cls}" data-open="${x.round.r}:${x.kind}" aria-label="${esc(k.long)}">
      <span class="rk">${k.tag === "QUALIFS" ? "QUAL" : k.tag === "SPRINT" ? "SPR" : k.tag === "COURSE" ? "GP" : k.tag}</span>
      <span class="rt">${hhmm(x.start)}</span>
    </button>`;
}

/* Jour en trois lettres : « ven. 9 oct. 08:30 » passait a la ligne et
   deformait les deux boites. La date complete reste au calendrier. */
function dayAbbr(d, tz) {
  return new Intl.DateTimeFormat("fr-FR", { weekday: "short", timeZone: tz })
    .format(d).replace(".", "").toUpperCase();
}

/* Le chrono : secondes seulement sous l'heure. Au-dela elles ne portent
   aucune decision et c'etait le seul mouvement gratuit de l'ecran. */
function chronoLine(ms) {
  const c = split(ms);
  const parts = ms < 3600000
    ? [[pad(c.m), "M"], [pad(c.s), "S"]]
    : (c.d > 0 ? [[pad(c.d), "J"], [pad(c.h), "H"], [pad(c.m), "M"]]
               : [[pad(c.h), "H"], [pad(c.m), "M"], [pad(c.s), "S"]]);
  return `<div class="chrono">${parts
    .map(([n, u]) => `<span class="n">${n}</span><span class="u">${u}</span>`)
    .join('<span class="sep">:</span>')}</div>`;
}

function frow(x, now) {
  const k = KINDS[x.kind];
  const past = x.end < now;
  const live = isLive(x, now);
  const v = verdict(x.kind, x.round.r);
  const mark = { ok: "ABONNÉ", free: "GRATUIT", pay: "PAYANT", none: "—" }[v.level];
  return `
    <button class="frow ${k.key ? "key" : ""} ${past ? "past" : ""}" data-open="${x.round.r}:${x.kind}">
      <span class="ftag">${k.tag}</span>
      <span class="fday">${dayShort(x.start)}</span>
      ${live
        ? `<span class="ftime"><span class="pill live"><span class="dot"></span>Direct</span></span>`
        : `<span class="ftime">${hhmm(x.start)}</span>`}
      <span class="fsrc ${v.level === "pay" ? "pay" : v.level === "none" ? "none" : ""}">${mark}</span>
    </button>`;
}

function renderLive() {
  const now = new Date();
  const cur = current(now);
  const el = $("s-live");

  if (!cur) {
    el.innerHTML = `<div class="empty">Saison ${SEASON} terminée.<br>Les 23 manches sont derrière nous.</div>`;
    return;
  }

  const { s, live } = cur;
  const rd = s.round;
  const k = KINDS[s.kind];
  const v = verdict(s.kind, rd.r);
  const freeCount = sourcesFor(s.kind, rd.r).filter(b => b.kind === "free").length;

  /* Le verdict remonte dans le hero : savoir OU regarder ne doit plus
     coûter trois taps. Le bouton rouge lance la source retenue. */
  const cta = v.src
    ? `<button class="cta" data-open="${rd.r}:${s.kind}">
         Ouvrir ${esc(v.src.name)}
         <span class="sub">${freeCount ? `+ ${freeCount} gratuit${freeCount > 1 ? "s" : ""} →` : "voir tout →"}</span>
       </button>`
    : `<button class="cta" data-open="${rd.r}:${s.kind}">Où regarder <span class="sub">→</span></button>`;

  const timing = live
    ? `<div class="hrs">
         <div class="hr"><div class="lbl">Commencée à</div><div class="val">${hhmm(s.start)}</div></div>
         <div class="hr"><div class="lbl">Fin estimée</div><div class="val">${hhmm(s.end)}</div></div>
       </div>`
    : `<div class="hrs">
         <div class="hr"><div class="lbl">Chez toi</div><div class="val">${dayAbbr(s.start)} ${hhmm(s.start)}</div></div>
         <div class="hr"><div class="lbl">${esc(rd.city)}</div><div class="val">${dayAbbr(s.start, rd.tz)} ${hhmm(s.start, rd.tz)}</div></div>
       </div>`;

  const head = live
    ? `<div><span class="pill live"><span class="dot"></span>En direct</span>
         <h1 class="session-name">${esc(k.long)}</h1></div>`
    : `<div><div class="eyebrow">Dans</div>
         ${chronoLine(s.start - now)}
         <h1 class="session-name">${esc(k.long)}</h1></div>`;

  const rest = roundSessions(rd).filter(x => x.end > now && x.kind !== s.kind);
  const leader = DRIVERS[0];

  el.innerHTML = `
    <div class="stack-l">
      <div class="hero">
        ${head}
        ${timing}
        <div class="verdict compact v-${v.level}">
          <span class="verdict-mark">●</span>
          <div style="min-width:0">
            <div class="verdict-title">${esc(v.title)}</div>
            <div class="verdict-detail">${esc(v.detail)}</div>
          </div>
        </div>
        ${cta}
      </div>

      ${rest.length ? `
      <div class="sec">
        <div class="sechead"><div class="eyebrow">Suite du week-end</div><span class="seccount">${rest.length} séance${rest.length > 1 ? "s" : ""}</span></div>
        <div class="flat">${rest.map(x => frow(x, now)).join("")}</div>
      </div>` : ""}

      <div class="sec">
        <div class="sechead"><div class="eyebrow">Championnat</div><span class="seccount">après M${STANDINGS_AFTER}</span></div>
        <button class="champrow" data-goto="stats">
          <span class="cpos">P1</span>
          <span style="min-width:0">
            <span class="rank-name" style="display:block">${esc(leader.first)} ${esc(leader.last)}</span>
            <span class="rank-team" style="display:block">${esc(leader.team)} · ${leader.w} victoire${leader.w > 1 ? "s" : ""}</span>
          </span>
          <span style="margin-left:auto;text-align:right">
            <span class="rank-val" style="display:block">${leader.pts}</span>
            <span class="rank-sub" style="display:block">pts</span>
          </span>
        </button>
      </div>

      <div class="sec">
        <div class="eyebrow">Manches suivantes</div>
        <div class="stack-s">
          ${ROUNDS.filter(x => roundEnd(x) > now && x.r !== rd.r).slice(0, 3).map(miniRound).join("")}
        </div>
      </div>
    </div>`;
}

function miniRound(rd) {
  return `
    <div class="round">
      <div class="round-head" style="cursor:default">
        <div class="round-flag">${flag(rd.cc)}</div>
        <div>
          <div class="round-id">MANCHE ${rd.r}</div>
          <div class="round-title">${esc(rd.name)}</div>
        </div>
        <div class="round-when">${dayShort(new Date(rd.s.race))}</div>
      </div>
    </div>`;
}

/* ==================================================================
   RENDU — Calendrier
   ================================================================== */

function srow(x, now) {
  const k = KINDS[x.kind];
  const past = x.end < now;
  const live = isLive(x, now);
  const free = sourcesFor(x.kind, x.round.r).some(b => b.kind === "free");
  return `
    <button class="srow ${k.key ? "key" : ""} ${past ? "past" : ""}" data-open="${x.round.r}:${x.kind}">
      <span class="srow-tag">${k.tag}</span>
      <span class="srow-day">${dayShort(x.start)}</span>
      ${free && !past ? `<span class="pill free">Gratuit</span>` : ""}
      ${live
        ? `<span class="srow-time"><span class="pill live"><span class="dot"></span>Direct</span></span>`
        : `<span class="srow-time">${hhmm(x.start)}</span>`}
    </button>`;
}

function renderCal() {
  const now = new Date();
  const list = state.past
    ? ROUNDS.filter(r => roundEnd(r) <= now).reverse()
    : ROUNDS.filter(r => roundEnd(r) > now);
  const nextR = current(now)?.s.round.r;

  $("s-cal").innerHTML = `
    <div class="stack-l">
      <div class="seg">
        <button data-past="0" aria-pressed="${!state.past}">À venir</button>
        <button data-past="1" aria-pressed="${state.past}">Terminées</button>
      </div>
      ${state.live ? "" : `
      <div class="notice"><span>◆</span>
        <div>Calendrier embarqué, figé au ${new Date(SNAPSHOT).toLocaleDateString("fr-FR")}. Fonctionne hors ligne mais ne suit pas un changement d'horaire décidé après cette date.</div>
      </div>`}
      <div class="stack-s">
        ${list.length ? list.map(rd => roundCard(rd, now, nextR)).join("") : `<div class="empty">Rien à afficher ici.</div>`}
      </div>
    </div>`;
}

function roundCard(rd, now, nextR) {
  const open = state.openRound === rd.r;
  const done = roundEnd(rd) <= now;
  const res = RESULTS.find(x => x.r === rd.r);

  return `
    <div class="round ${rd.r === nextR ? "next" : ""} ${done ? "done" : ""}" open-state="${open ? 1 : 0}">
      <button class="round-head" data-round="${rd.r}" aria-expanded="${open}">
        <div class="round-flag">${flag(rd.cc)}</div>
        <div>
          <div class="round-id">MANCHE ${rd.r}${rd.s.sprint ? ` · <span style="color:var(--warn)">SPRINT</span>` : ""}</div>
          <div class="round-title">${esc(rd.name)}</div>
          <div class="round-sub">${res ? `Vainqueur : ${esc(res.winName)}` : `${esc(rd.circuit)} · ${esc(rd.city)}`}</div>
        </div>
        <div class="round-when">${dayShort(new Date(rd.s.race))}<br><span class="chev">›</span></div>
      </button>
      ${open ? `<div class="sessions">
        ${rd.suspect ? `<div class="notice" style="margin:8px"><span>◆</span>
          <div>L'API renvoie un intitulé incohérent pour cette manche (« Bahrain Grand Prix in Malaysia »). Circuit et horaires sont ceux de Sepang. À confirmer.</div></div>` : ""}
        ${roundSessions(rd).map(x => srow(x, now)).join("")}
      </div>` : ""}
    </div>`;
}

function renderStats() {

  $("s-stats").innerHTML = `
    <div class="stack-l">

        <button data-stats="drivers"  aria-pressed="${v === "drivers"}">Pilotes</button>

}

          </div>`).join("")}

}

function teamsTable() {
  const t = constructorTable();
  const max = t[0].pts || 1;
  return `
    <div class="sec">

        <div class="eyebrow">Championnat constructeurs</div>

function palmaresTable() {
  const byDriver = new Map();
  for (const r of RESULTS) byDriver.set(r.winName, (byDriver.get(r.winName) || 0) + 1);

  return `
    <div class="sec">
      <div class="eyebrow">Vainqueurs de la saison</div>

        ${RESULTS.slice().reverse().map(r => {
          const rd = ROUNDS.find(x => x.r === r.r);
          return `
          <div class="podium">

        }).join("")}
      </div>

    <div class="sec">

          </div>`).join("")}

      <div class="prose">${RESULTS.length} manches disputées sur 23. Poles renseignées pour ${poles} d'entre elles — l'API n'en publie pas au-delà.</div>

function openSheet(roundNo, kind) {
  state.sheet = { r: roundNo, kind };
  state.openSrc = null;
  renderSheet();
  $("sheet-bg").classList.add("on");
  $("sheet").classList.add("on");
  document.body.style.overflow = "hidden";
}

function closeSheet() {
  state.sheet = null;
  $("sheet-bg").classList.remove("on");
  $("sheet").classList.remove("on");
  document.body.style.overflow = "";
}

function qualityMeter(b) {
  const bars = [1, 2, 3].map(n => `<i class="${n <= b.q ? "fill" : ""}"></i>`).join("");
  return `<span class="qual"><span class="bars ${b.qSrc ? "" : "est"}">${bars}</span>
    <span class="qual-label">${esc(QUALITY[b.q])}${b.qSrc ? "" : " ?"}</span></span>`;
}

function sourceCard(b) {
  const owned  = state.subs.includes(b.id);
  const pref   = state.lang !== "all" && b.lang === state.lang;
  const pinned = b.id === state.lastSrc;
  const open   = state.openSrc === b.id;
  const conf   = CONF[b.conf];
  const where  = b.ccs ? b.ccs.map(flag).join(" ") : `${flag(b.cc)} ${esc(countryName(b.cc))}`;
  const custom  = state.customUrls[b.id] || null;
  const target  = custom || LIVE_URLS[b.id] || b.url;
  const editing = state.editUrl === b.id;

  return `
    <div class="src ${owned ? "owned" : ""} ${pref ? "pref" : ""} ${pinned ? "pinned" : ""}" data-open="${open ? 1 : 0}">
      <button class="src-main" data-src="${b.id}" aria-expanded="${open}">
        <div class="src-id">
          <div class="src-name">${esc(b.name)}</div>
          <div class="src-where">${where}${pinned ? " · dernière utilisée" : ""}</div>
          <div class="src-tags">
            ${b.kind === "free" ? `<span class="pill free">Gratuit</span>` : `<span class="pill quiet">Abonnement</span>`}
            <span class="pill lang">${esc(b.lang.toUpperCase())}</span>
            ${owned ? `<span class="pill owned">Abonné</span>` : ""}
            ${conf ? `<span class="pill warn">${esc(conf)}</span>` : ""}
            ${qualityMeter(b)}
          </div>
        </div>
        <span class="src-more">›</span>
      </button>

      ${open ? `<div class="src-detail">
        <div class="src-scope">${esc(b.scope)}</div>
        <div class="src-geo">Accessible depuis : ${esc(b.geo)}</div>
        <div class="src-note">${esc(b.note)}</div>

        <div class="urlbox">
          <div class="urlbox-head">
            <span class="eyebrow" style="font-size:10.5px">Lien direct</span>
            ${custom ? `<span class="pill free">Corrigé par toi</span>`
                     : `<span class="pill warn">Non vérifié</span>`}
          </div>
          <div class="src-host">${esc(target)}</div>
          ${editing
            ? `<div class="urledit">
                 <input id="urlin" type="url" inputmode="url" placeholder="Colle l'URL du player en direct"
                        value="${esc(custom || target)}">
                 <div class="src-actions" style="padding:0">
                   <button class="go" data-save="${b.id}">Enregistrer</button>
                   <button data-canceledit="1">Annuler</button>
                 </div>
               </div>`
            : `<div class="src-actions" style="padding:0">
                 <button data-edit="${b.id}">${custom ? "Modifier ce lien" : "Corriger ce lien"}</button>
                 ${custom ? `<button data-reset="${b.id}">Rétablir</button>` : ""}
               </div>`}
          <div class="src-note" style="margin-top:8px">
            ${custom
              ? "Ta correction remplace le lien par défaut et voyage dans ton lien de réglages."
              : "Ce chemin n'a pas pu être testé — les sites de diffuseurs bloquent l'accès automatisé. S'il ne tombe pas sur le player, colle la bonne URL ici : elle sera mémorisée."}
          </div>
        </div>
      </div>` : ""}

      <div class="src-actions">
        <a class="go" href="${esc(target)}" target="_blank" rel="noopener noreferrer" data-launch="${b.id}">Direct ↗</a>
        <a href="${esc(b.url)}" target="_blank" rel="noopener noreferrer" data-launch="${b.id}">Accueil ↗</a>

      </div>
    </div>`;
}

function renderSheet() {
  if (!state.sheet) return;
  const rd = ROUNDS.find(x => x.r === state.sheet.r);
  const kind = state.sheet.kind;
  const k = KINDS[kind];
  const start = new Date(rd.s[kind]);
  const now = new Date();
  const live = now >= start && now <= new Date(start.getTime() + k.mins * 60000);

  const v = verdict(kind, rd.r);
  const full = sourcesFor(kind, rd.r);
  const list = state.srcView === "free" ? full.filter(b => b.kind === "free")
             : state.srcView === "mine" ? full.filter(b => state.subs.includes(b.id))
             : full;
  const free = list.filter(b => b.kind === "free");
  const pay  = list.filter(b => b.kind === "pay");
  const mineCount = full.filter(b => state.subs.includes(b.id)).length;

  $("sheet").innerHTML = `
    <div class="sheet-bar">
      <div>
        <div class="eyebrow">${flag(rd.cc)} Manche ${rd.r} · ${esc(rd.city)}</div>

      </div>
      <button class="close" id="x">✕</button>

        <div class="times">
          <div><span>Chez toi</span><b>${dayLong(start)} · ${hhmm(start)}</b></div>
          <div><span>Au circuit</span><b>${dayLong(start, rd.tz)} · ${hhmm(start, rd.tz)}</b></div>
          <div><span>Durée nominale</span><b>${k.mins} min</b></div>
        </div>
      </div>

      <div class="verdict v-${v.level}">
        <div class="verdict-mark">${v.level === "ok" ? "●" : v.level === "free" ? "◆" : "○"}</div>
        <div>
          <div class="verdict-title">${esc(v.title)}</div>
          <div class="verdict-detail">${esc(v.detail)}</div>
          ${state.country === "all" && v.level !== "none"
            ? `<div class="verdict-detail" style="margin-top:5px;opacity:.8">Verdict établi tous pays confondus. Choisis le pays où tu es pour qu'il tienne compte du géoblocage.</div>`
            : ""}
        </div>
        ${v.src ? `<a class="verdict-go" href="${esc(state.customUrls[v.src.id] || LIVE_URLS[v.src.id] || v.src.url)}"
             target="_blank" rel="noopener noreferrer" data-launch="${v.src.id}">Ouvrir ↗</a>` : ""}
      </div>

      ${now > new Date(start.getTime() + k.mins * 60000) ? `
      <button class="btn" data-ana="${rd.r}:${kind}" style="display:flex;align-items:center;justify-content:space-between;gap:10px">
        <span>Analyser la séance</span>
        <span style="font-family:var(--mono);font-size:11px;color:var(--muted)">rythme · secteurs · pneus →</span>
      </button>` : ""}

      <div class="seg" id="srcseg">
        <button data-srcview="all"  aria-pressed="${state.srcView === "all"}">Tout <span class="segnum">${full.length}</span></button>
        <button data-srcview="free" aria-pressed="${state.srcView === "free"}">Gratuit <span class="segnum">${full.filter(b => b.kind === "free").length}</span></button>

      </div>`}

    store.set("country", state.country);
    renderSheet();
    render();
  };
}

function renderWatchbar() {
  const now = new Date();
  const cur = current(now);
  const bar = $("watchbar");

  // Visible seulement quand c'est utile : en direct, ou à moins de 3 h.
  if (!cur || (!cur.live && cur.s.start - now > 3 * 3600 * 1000)) {
    bar.classList.remove("on");
    bar.innerHTML = "";
    return;
  }

  const k = KINDS[cur.s.kind];
  const c = split(cur.s.start - now);
  const sub = cur.live ? "en cours" : `dans ${c.h ? c.h + " h " : ""}${pad(c.m)} min`;

  bar.classList.add("on");
  bar.innerHTML = `
    <button data-open="${cur.s.round.r}:${cur.s.kind}">
      <span>${cur.live ? "● " : ""}Regarder ${esc(k.tag)}</span>
      <span class="sub">${esc(sub)}</span>
    </button>`;
}

function show(tab) {
  state.tab = tab;
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("on"));
  $("s-" + tab).classList.add("on");
  document.querySelectorAll(".tabbar button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
  render();
  window.scrollTo(0, 0);
}

document.querySelector(".tabbar").onclick = e => {
  const b = e.target.closest("[data-tab]");
  if (b) show(b.dataset.tab);
};

$("topbar").addEventListener("click", e => {
  const g = e.target.closest("[data-goto]");
  if (g) { show(g.dataset.goto); return; }
  const op = e.target.closest("[data-open]");
  if (op) { const [r, k] = op.dataset.open.split(":"); openSheet(Number(r), k); }

/* Actions dans la feuille : déplier une source, ouvrir, copier. */
$("sheet").addEventListener("click", async e => {
  const an = e.target.closest("[data-ana]");
  if (an) { const [ar, ak] = an.dataset.ana.split(":"); openAnalysis(Number(ar), ak); return; }
  const edit = e.target.closest("[data-edit]");
  if (edit) { state.editUrl = edit.dataset.edit; renderSheet(); $("urlin")?.focus(); return; }

  if (e.target.closest("[data-canceledit]")) { state.editUrl = null; renderSheet(); return; }

  const save = e.target.closest("[data-save]");
  if (save) {
    const val = ($("urlin")?.value || "").trim();
    if (!/^https?:\/\/.+/i.test(val)) { toast("URL invalide — elle doit commencer par https://"); return; }
    state.customUrls = Object.assign({}, state.customUrls, { [save.dataset.save]: val });
    store.set("customUrls", state.customUrls);
    state.editUrl = null;
    renderSheet();
    toast("Lien corrigé et mémorisé");
    return;
  }

  const reset = e.target.closest("[data-reset]");
  if (reset) {
    const next = Object.assign({}, state.customUrls);
    delete next[reset.dataset.reset];
    state.customUrls = next;
    store.set("customUrls", state.customUrls);
    renderSheet();
    toast("Lien par défaut rétabli");
    return;
  }

  const src = e.target.closest("[data-src]");
  if (src) {
    state.openSrc = state.openSrc === src.dataset.src ? null : src.dataset.src;
    state.editUrl = null;
    renderSheet();
    return;
  }
  const launch = e.target.closest("[data-launch]");
  if (launch) {
    state.lastSrc = launch.dataset.launch;
    store.set("lastSrc", state.lastSrc);
    return;   // on laisse le lien s'ouvrir normalement
  }
  const copy = e.target.closest("[data-copy]");
  if (copy) {
    try { await navigator.clipboard.writeText(copy.dataset.copy); toast("Lien copié"); }
    catch (err) { toast("Copie refusée par le navigateur"); }
  }
});

/* Rafraîchissement du calendrier depuis l'API.
   Sur un artefact claude.ai, la politique de sécurité bloque les appels
   sortants : échec immédiat et silencieux, la page garde ses données
   embarquées. Héberge ce fichier ailleurs et l'appel passe. */
(async function refresh() {
  const TZ = {
    albert_park:"Australia/Melbourne", shanghai:"Asia/Shanghai", suzuka:"Asia/Tokyo",
    miami:"America/New_York", villeneuve:"America/Toronto", monaco:"Europe/Monaco",
    catalunya:"Europe/Madrid", red_bull_ring:"Europe/Vienna", silverstone:"Europe/London",
    spa:"Europe/Brussels", hungaroring:"Europe/Budapest", zandvoort:"Europe/Amsterdam",
    monza:"Europe/Rome", madring:"Europe/Madrid", baku:"Asia/Baku",
    sepang:"Asia/Kuala_Lumpur", marina_bay:"Asia/Singapore", americas:"America/Chicago",
    rodriguez:"America/Mexico_City", interlagos:"America/Sao_Paulo", vegas:"America/Los_Angeles",
    losail:"Asia/Qatar", yas_marina:"Asia/Dubai"
  };
  const iso = b => (b && b.date && b.time) ? b.date + "T" + b.time.replace("Z", "") + "Z" : null;

  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 4000);
    const res = await fetch(`https://api.jolpi.ca/ergast/f1/${SEASON}/races/?format=json&limit=100`, { signal: ctrl.signal });
    clearTimeout(timer);
    if (!res.ok) return;

    const races = (await res.json())?.MRData?.RaceTable?.Races;
    if (!Array.isArray(races) || !races.length) return;

    const fresh = races.map(x => {
      const s = {};
      const map = [["fp1", x.FirstPractice], ["fp2", x.SecondPractice], ["fp3", x.ThirdPractice],
                   ["sq", x.SprintQualifying || x.SprintShootout], ["sprint", x.Sprint], ["q", x.Qualifying]];
      for (const [k, box] of map) { const v = iso(box); if (v) s[k] = v; }
      const r = iso({ date: x.date, time: x.time });
      if (r) s.race = r;
      if (!Object.keys(s).length) return null;
      const known = ROUNDS.find(o => o.r === Number(x.round));
      if (!known) return null;
      return Object.assign({}, known, { s, tz: TZ[x.Circuit?.circuitId] || known.tz });
    }).filter(Boolean);

    if (fresh.length < 10) return;
    ROUNDS.length = 0;
    ROUNDS.push(...fresh.sort((a, b) => a.r - b.r));
    state.live = true;
    render();
  } catch (e) { /* réseau bloqué : les données embarquées font le travail */ }
})();

/* ==================================================================
   ANALYSE DE SÉANCE — API OpenF1 (openf1.org)
   Niveau gratuit : tous les endpoints, historique depuis 2023, pas de
   flux en direct (celui-ci est réservé aux comptes sponsors). Les
   données d'une séance arrivent donc une fois celle-ci terminée.

   ================================================================== */

const OF1 = "https://api.openf1.org/v1/";

/* Teintes de séries validées pour le fond sombre #14141C
   (bande de clarté, plancher de chroma, séparation en vision
   déficiente et contraste : tous les contrôles passent). */
const SERIES = ["#3987E5", "#D95926", "#199E70", "#C98500", "#D55181"];
const MAX_SERIES = SERIES.length;

/* Code couleur pneu officiel : universel chez tous les diffuseurs.
   Il sort du nuancier de l'app — c'est assumé, et chaque segment
   porte sa lettre pour que la couleur ne soit jamais seule à parler. */
const TYRES = {
  SOFT:         { c:"#FF3333", l:"S", n:"Tendre",      dark:true  },
  MEDIUM:       { c:"#FFF200", l:"M", n:"Medium",      dark:false },
  HARD:         { c:"#FFFFFF", l:"H", n:"Dur",         dark:false },
  INTERMEDIATE: { c:"#43B02A", l:"I", n:"Intermédiaire", dark:false },
  WET:          { c:"#0067AD", l:"W", n:"Pluie",       dark:true  },
  UNKNOWN:      { c:"#3A3A4C", l:"?", n:"Inconnu",     dark:true  }
};

const ofCache = new Map();
async function of1(path) {
  if (ofCache.has(path)) return ofCache.get(path);
  const ctl = new AbortController();
  const to = setTimeout(() => ctl.abort(), 15000);
  try {
    const r = await fetch(OF1 + path, { signal: ctl.signal, cache: "force-cache" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    ofCache.set(path, j);
    return j;
  } finally { clearTimeout(to); }
}

const ana = { open:false, s:null, key:null, drivers:null, stints:null, laps:null,
              sel:[], step:"init", err:null };

/* Appariement par instant de départ : OpenF1 nomme parfois la manche
   autrement que l'API Jolpica (manche 16 : « Bahrain » chez l'un,
   « Malaisie » chez l'autre). La date, elle, ne ment pas. */
async function of1Key(sess) {
  const list = await of1("sessions?year=" + SEASON);
  let best = null, bestGap = Infinity;
  for (const o of list) {
    const gap = Math.abs(new Date(o.date_start) - sess.start);
    if (gap < bestGap) { bestGap = gap; best = o; }
  }
  return bestGap <= 2 * 3600 * 1000 ? best.session_key : null;
}

function openAnalysis(roundNo, kind) {
  const rd = ROUNDS.find(r => r.r === roundNo);
  const sess = roundSessions(rd).find(x => x.kind === kind);
  if (!sess) return;
  closeSheet();
  Object.assign(ana, { open:true, s:sess, key:null, drivers:null, stints:null,
                       laps:null, sel:[], step:"loading", err:null });
  $("ana-bg").classList.add("on");
  $("ana").classList.add("on");
  document.body.style.overflow = "hidden";
  renderAna();
  loadAnaBase();
}

function closeAnalysis() {
  ana.open = false;
  $("ana-bg").classList.remove("on");
  $("ana").classList.remove("on");
  document.body.style.overflow = "";
}

async function loadAnaBase() {
  try {
    const key = await of1Key(ana.s);
    if (!key) { ana.step = "none"; renderAna(); return; }
    ana.key = key;
    const [drivers, stints] = await Promise.all([
      of1("drivers?session_key=" + key),
      of1("stints?session_key=" + key)
    ]);
    if (!stints.length) { ana.step = "none"; renderAna(); return; }
    ana.drivers = drivers;
    ana.stints = stints;
    const present = new Set(stints.map(x => x.driver_number));
    ana.sel = DRIVERS.filter(d => present.has(d.n)).slice(0, MAX_SERIES).map(d => d.n);
    ana.step = "base";
  } catch (e) {
    ana.err = e.message; ana.step = "error";
  }
  renderAna();
}

async function loadAnaLaps() {
  ana.step = "laps-loading"; renderAna();
  try {
    ana.laps = await of1("laps?session_key=" + ana.key);
    ana.step = "laps";
  } catch (e) { ana.err = e.message; ana.step = "error"; }
  renderAna();
}

const drvName = n => (DRIVERS.find(d => d.n === n) || {}).last
                  || ((ana.drivers || []).find(d => d.driver_number === n) || {}).name_acronym
                  || ("#" + n);
const drvCode = n => (DRIVERS.find(d => d.n === n) || {}).code
                  || ((ana.drivers || []).find(d => d.driver_number === n) || {}).name_acronym
                  || String(n);
const hue = n => SERIES[ana.sel.indexOf(n)] || "var(--muted)";
const mmss = sec => {
  if (sec == null) return "—";
  const m = Math.floor(sec / 60), r = sec - m * 60;
  return m ? `${m}:${r.toFixed(3).padStart(6, "0")}` : r.toFixed(3);
};

/* ---------- Relais et pneus ---------- */
function stintStrip() {
  const by = new Map();
  for (const st of ana.stints) {
    if (!by.has(st.driver_number)) by.set(st.driver_number, []);
    by.get(st.driver_number).push(st);
  }
  const total = Math.max(...ana.stints.map(s => s.lap_end || 0), 1);
  const order = [...by.keys()].sort((a, b) => {
    const pa = (DRIVERS.find(d => d.n === a) || { p: 99 }).p;
    const pb = (DRIVERS.find(d => d.n === b) || { p: 99 }).p;
    return pa - pb;
  });
  const used = new Set(ana.stints.map(s => s.compound || "UNKNOWN"));

  return `
    <div class="sec">
      <div class="sechead"><div class="eyebrow">Relais et pneus</div><span class="seccount">${order.length} pilotes</span></div>
      <div class="viz">
        <div class="stints">
          ${order.map(n => {
            const segs = by.get(n).sort((a, b) => a.stint_number - b.stint_number);
            return `<div class="stint-row">
              <div class="stint-who">${esc(drvCode(n))}</div>
              <div class="stint-bars">
                ${segs.map(st => {
                  const t = TYRES[st.compound] || TYRES.UNKNOWN;
                  const len = Math.max(1, (st.lap_end || 0) - (st.lap_start || 0) + 1);
                  return `<div class="stint-seg ${t.dark ? "dark" : ""}"
                            style="flex:${len};background:${t.c}"
                            title="${esc(t.n)} · tours ${st.lap_start}–${st.lap_end} · ${st.tyre_age_at_start} tour(s) d'usure au départ">${t.l}</div>`;
                }).join("")}
              </div>
            </div>`;
          }).join("")}
        </div>
        <div class="tyrekey">
          ${[...used].map(c => { const t = TYRES[c] || TYRES.UNKNOWN;
            return `<span><i style="background:${t.c}"></i>${t.l} — ${esc(t.n)}</span>`; }).join("")}
        </div>
      </div>
      <div class="prose">Largeur proportionnelle au nombre de tours du relais. ${total} tours au total.</div>
    </div>`;
}

/* ---------- Rythme au tour ----------
   Un tour d'arrêt ou de voiture de sécurité peut valoir le double d'un
   tour normal : sans écrêtage de l'échelle, toutes les courbes
   s'aplatissent. On borne au 90e centile + 3 s et on signale le reste. */
function paceChart() {
  const W = 358, H = 230, PL = 42, PR = 8, PT = 10, PB = 22;
  const sel = ana.sel;
  const rows = ana.laps.filter(l => sel.includes(l.driver_number) && l.lap_duration);
  if (!rows.length) return `<div class="prose">Aucun temps au tour exploitable pour cette sélection.</div>`;

  const times = rows.map(l => l.lap_duration).sort((a, b) => a - b);
  const fastest = times[0];
  const lo = fastest - 0.4;
  const q = f => times[Math.min(times.length - 1, Math.floor(times.length * f))];
  const hi = Math.max(fastest * 1.06, Math.min(q(0.90), fastest * 1.35));
  const maxLap = Math.max(...rows.map(l => l.lap_number));
  const clipped = rows.filter(l => l.lap_duration > hi).length;

  const x = n => PL + (n - 1) / Math.max(1, maxLap - 1) * (W - PL - PR);
  const y = t => PT + (1 - (Math.min(t, hi) - lo) / Math.max(0.001, hi - lo)) * (H - PT - PB);

  const ticks = 4, yt = [];
  for (let i = 0; i <= ticks; i++) yt.push(lo + (hi - lo) * i / ticks);
  const xStep = maxLap > 40 ? 10 : maxLap > 20 ? 5 : 2;

  const paths = sel.map((n, i) => {
    const pts = rows.filter(l => l.driver_number === n).sort((a, b) => a.lap_number - b.lap_number);
    if (!pts.length) return "";
    let d = "", pen = false;
    for (const l of pts) {
      if (l.lap_duration > hi) { pen = false; continue; }
      d += `${pen ? "L" : "M"}${x(l.lap_number).toFixed(1)},${y(l.lap_duration).toFixed(1)}`;
      pen = true;
    }
    if (!d) return "";
    return `<path class="serie" d="${d}" stroke="${SERIES[i]}"/>`;
  }).join("");

  return `
    <div class="viz" style="position:relative" id="pace">
      <svg viewBox="0 0 ${W} ${H}" role="img"
           aria-label="Temps au tour par pilote, du tour 1 au tour ${maxLap}">
        <g class="grid">
          ${yt.map(t => `<line x1="${PL}" x2="${W - PR}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" opacity="${t === yt[0] ? .9 : .45}"/>`).join("")}
        </g>
        <g class="axis" text-anchor="end">
          ${yt.map(t => `<text x="${PL - 6}" y="${(y(t) + 3.4).toFixed(1)}">${mmss(t).slice(0, 6)}</text>`).join("")}
        </g>
        <g class="axis" text-anchor="middle">
          ${Array.from({ length: Math.floor(maxLap / xStep) + 1 }, (_, i) => i * xStep).filter(v => v >= 1).map(v =>
            `<text x="${x(v).toFixed(1)}" y="${H - 6}">${v}</text>`).join("")}
        </g>
        ${paths}
        <line class="cross" id="cx" x1="0" x2="0" y1="${PT}" y2="${H - PB}" style="display:none"/>
        <g id="cpts"></g>
        <rect class="hit" id="hit" x="${PL}" y="${PT}" width="${W - PL - PR}" height="${H - PT - PB}"/>
      </svg>
      <div class="tip" id="tip" style="display:none"></div>
    </div>
    <div class="legend" role="group" aria-label="Pilotes affichés">
      ${DRIVERS.filter(d => ana.laps.some(l => l.driver_number === d.n)).map(d => {
          const on = sel.includes(d.n);
          return `<button data-drv="${d.n}" aria-pressed="${on}">
            <span class="swatch" style="background:${on ? hue(d.n) : "var(--muted)"}"></span>
            <span class="code">${esc(d.code)}</span></button>`;
        }).join("")}
    </div>
    <div class="prose" style="margin-top:8px">
      Échelle bornée à ${mmss(hi).slice(0, 6)}, adaptée à la dispersion de la séance${clipped ? ` — ${clipped} tour${clipped > 1 ? "s" : ""} au-delà : arrêt, voiture de sécurité ou drapeau. La courbe s'interrompt plutôt que de s'aplatir, pour ne pas mentir sur le rythme` : ""}.
      Cinq pilotes au maximum : au-delà, les teintes ne se distinguent plus de façon fiable.
    </div>`;
}

/* ---------- Secteurs ---------- */
function sectorTable() {
  const best = n => {
    const ls = ana.laps.filter(l => l.driver_number === n);
    const mn = k => { const v = ls.map(l => l[k]).filter(x => x != null); return v.length ? Math.min(...v) : null; };
    return { s1: mn("duration_sector_1"), s2: mn("duration_sector_2"), s3: mn("duration_sector_3"), lap: mn("lap_duration") };
  };
  const rows = ana.sel.map(n => ({ n, ...best(n) }));
  const colMin = k => { const v = rows.map(r => r[k]).filter(x => x != null); return v.length ? Math.min(...v) : null; };
  const m = { s1: colMin("s1"), s2: colMin("s2"), s3: colMin("s3"), lap: colMin("lap") };
  const cell = (v, k) => `<td class="${v != null && v === m[k] ? "best" : ""}">${v == null ? "—" : (k === "lap" ? mmss(v) : v.toFixed(3))}</td>`;

  return `
    <div class="sec">
      <div class="sechead"><div class="eyebrow">Meilleurs secteurs</div><span class="seccount">en secondes</span></div>
      <div class="viz">
        <table class="sect">
          <thead><tr><th>Pilote</th><th>S1</th><th>S2</th><th>S3</th><th>Tour</th></tr></thead>
          <tbody>${rows.map(r => `<tr><td>${esc(drvCode(r.n))}</td>${cell(r.s1, "s1")}${cell(r.s2, "s2")}${cell(r.s3, "s3")}${cell(r.lap, "lap")}</tr>`).join("")}</tbody>
        </table>
      </div>
      <div class="prose">En vert, le meilleur de la sélection sur chaque colonne. Les meilleurs secteurs ne proviennent pas forcément du même tour : leur somme est un tour théorique, pas un tour réalisé.</div>
    </div>`;
}

function renderAna() {
  const el = $("ana");
  if (!ana.s) { el.innerHTML = ""; return; }
  const k = KINDS[ana.s.kind], rd = ana.s.round;
  const head = `
    <div class="sheet-bar">
      <div class="ana-bar">
        <button class="ana-back" id="ana-close" aria-label="Fermer">‹</button>
        <div>
          <div class="ana-title">${esc(k.long)}</div>
          <div class="ana-sub">${esc(rd.name)} · ${esc(rd.circuit)}</div>
        </div>
      </div>
    </div>`;

  let body;
  if (ana.step === "loading") body = `<div class="loading">Lecture des données OpenF1…</div>`;
  else if (ana.step === "error") body = `
    <div class="notice"><span>◆</span><div>Données indisponibles (${esc(ana.err || "réseau")}).
      OpenF1 limite à 3 requêtes par seconde sans compte ; réessaie dans un instant.</div></div>`;
  else if (ana.step === "none") body = `
    <div class="notice"><span>◆</span><div>Aucune donnée pour cette séance. Le niveau gratuit d'OpenF1 ne sert pas
      le direct : les tours, secteurs et relais n'apparaissent qu'une fois la séance terminée.</div></div>`;
  else body = `
    <div class="stack-l">
      ${stintStrip()}
      <div class="sec">
        <div class="sechead"><div class="eyebrow">Rythme au tour</div><span class="seccount">${ana.step === "laps" ? "chargé" : "~0,5 Mo"}</span></div>
        ${ana.step === "laps" ? paceChart()
          : ana.step === "laps-loading" ? `<div class="loading">Chargement des tours…</div>`
          : `<button class="btn" id="ana-laps">Charger le rythme au tour et les secteurs</button>
             <div class="prose">Environ 0,5 Mo. Chargé à la demande pour ne pas consommer de données en déplacement.</div>`}
      </div>
      ${ana.step === "laps" ? sectorTable() : ""}
      <div class="prose">Source : <strong>OpenF1</strong> (openf1.org), licence CC BY-NC-SA 4.0, usage personnel.
        Projet non officiel, sans lien avec la Formule 1.</div>
    </div>`;

  el.innerHTML = head + body;
  if (ana.step === "laps") wirePace();
}

function wirePace() {
  const svg = $("pace").querySelector("svg");
  const hit = $("hit"), cx = $("cx"), cpts = $("cpts"), tip = $("tip");
  const W = 358, PL = 42, PR = 8;
  const rows = ana.laps.filter(l => ana.sel.includes(l.driver_number) && l.lap_duration);
  const maxLap = Math.max(...rows.map(l => l.lap_number));
  const times = rows.map(l => l.lap_duration).sort((a, b) => a - b);
  const lo = times[0] - 0.4;
  const q = f => times[Math.min(times.length - 1, Math.floor(times.length * f))];
  const hi = Math.max(times[0] * 1.06, Math.min(q(0.90), times[0] * 1.35));
  const H = 230, PT = 10, PB = 22;
  const x = n => PL + (n - 1) / Math.max(1, maxLap - 1) * (W - PL - PR);
  const y = t => PT + (1 - (Math.min(t, hi) - lo) / Math.max(.001, hi - lo)) * (H - PT - PB);

  const move = ev => {
    const r = svg.getBoundingClientRect();
    const px = ((ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left) / r.width * W;
    const lap = Math.round(1 + (px - PL) / (W - PL - PR) * (maxLap - 1));
    if (lap < 1 || lap > maxLap) return;
    cx.style.display = ""; cx.setAttribute("x1", x(lap)); cx.setAttribute("x2", x(lap));
    const here = ana.sel.map((n, i) => ({ n, i, l: rows.find(l => l.driver_number === n && l.lap_number === lap) })).filter(o => o.l);
    const vis = here.filter(o => o.l.lap_duration <= hi);
    cpts.innerHTML = vis.map(o => `<circle class="pt" cx="${x(lap).toFixed(1)}" cy="${y(o.l.lap_duration).toFixed(1)}" r="4" fill="${SERIES[o.i]}"/>`).join("");
    tip.style.display = "";
    tip.innerHTML = `<div class="lap">TOUR ${lap}</div>` + here.map(o =>
      `<div class="row"><span class="swatch" style="background:${SERIES[o.i]};width:9px;height:9px;border-radius:2px"></span>${esc(drvCode(o.n))}<b>${mmss(o.l.lap_duration)}</b></div>`).join("");
    const left = Math.min(Math.max(8, x(lap) / W * r.width - 56), r.width - 130);
    tip.style.left = left + "px"; tip.style.top = "14px";
  };
  const leave = () => { cx.style.display = "none"; cpts.innerHTML = ""; tip.style.display = "none"; };
  hit.addEventListener("mousemove", move);
  hit.addEventListener("mouseleave", leave);
  hit.addEventListener("touchstart", move, { passive: true });
  hit.addEventListener("touchmove", move, { passive: true });
  hit.addEventListener("touchend", leave);
}

$("ana").addEventListener("click", e => {
  if (e.target.closest("#ana-close")) { closeAnalysis(); return; }
  if (e.target.closest("#ana-laps"))  { loadAnaLaps(); return; }
  const d = e.target.closest("[data-drv]");
  if (d) {
    const n = Number(d.dataset.drv);
    const i = ana.sel.indexOf(n);
    if (i >= 0) { if (ana.sel.length > 1) ana.sel.splice(i, 1); }
    else if (ana.sel.length < MAX_SERIES) ana.sel.push(n);
    else { toast(`${MAX_SERIES} pilotes au maximum — retire-s'en un`); return; }
    renderAna();
  }
});
$("ana-bg").onclick = closeAnalysis;

</script>
